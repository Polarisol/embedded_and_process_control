<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 768 360" width="768" height="360" font-family="Helvetica, Arial, sans-serif">
<rect width="768" height="360" rx="10" fill="#ffffff"/>
<text x="384.0" y="28" font-size="17" font-weight="bold" text-anchor="middle" fill="#111827">INPUT: the pin reads a voltage as HIGH or LOW</text>
<text x="100" y="58" font-size="13" font-weight="bold" text-anchor="middle" fill="#111827">Voltage on the pin</text>
<rect x="60" y="70.0" width="80" height="55.8" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
<text x="152" y="102.9" font-size="14" font-weight="bold" fill="#15803d">HIGH  (1)</text>
<rect x="60" y="125.8" width="80" height="118.5" fill="#fef3c7" stroke="#a16207" stroke-width="1.5"/>
<text x="152" y="190.0" font-size="14" font-weight="bold" fill="#a16207">unclear</text>
<rect x="60" y="244.2" width="80" height="55.8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<text x="152" y="277.1" font-size="14" font-weight="bold" fill="#1d4ed8">LOW  (0)</text>
<text x="152" y="207.0" font-size="12" fill="#374151">random, avoid</text>
<text x="54" y="74.0" font-size="11" text-anchor="end" fill="#374151">3.3 V</text>
<text x="54" y="129.8" font-size="11" text-anchor="end" fill="#374151">≈ 2.5 V</text>
<text x="54" y="248.2" font-size="11" text-anchor="end" fill="#374151">≈ 0.8 V</text>
<text x="54" y="304.0" font-size="11" text-anchor="end" fill="#374151">0 V</text>
<rect x="300" y="56" width="452" height="284" rx="8" fill="#f8fafc"/>
<text x="526" y="80" font-size="14" font-weight="bold" text-anchor="middle" font-family="Courier New, monospace" fill="#1d4ed8">pinMode(D2, INPUT_PULLUP);</text>
<rect x="320" y="96" width="180" height="200" rx="8" fill="#ccfbf1" stroke="#0f766e" stroke-width="2"/>
<text x="330" y="116" font-size="12" font-weight="bold" fill="#0f766e">inside the Nano ESP32</text>
<text x="380" y="140" font-size="12" font-weight="bold" text-anchor="middle" fill="#b42318">3.3 V</text>
<polyline fill="none" stroke="#b42318" stroke-width="2.5" stroke-linejoin="round" points="380,146 380,160"/>
<polyline fill="none" stroke="#b42318" stroke-width="2.5" stroke-linejoin="round" points="380,160 372,164.2 388,172.5 372,180.8 388,189.2 372,197.5 388,205.8 380,210"/>
<text x="396" y="190" font-size="12" fill="#374151">pull-up</text>
<polyline fill="none" stroke="#111827" stroke-width="2.5" stroke-linejoin="round" points="380,210 380,230 490,230"/>
<circle cx="380" cy="230" r="4" fill="#111827"/>
<polyline fill="none" stroke="#111827" stroke-width="2.5" stroke-linejoin="round" points="380,230 380,262"/>
<rect x="350" y="262" width="60" height="22" rx="4" fill="#ffffff" stroke="#111827" stroke-width="1.5"/>
<text x="380" y="277" font-size="11" text-anchor="middle" fill="#111827">reads pin</text>
<rect x="484" y="221" width="34" height="18" rx="9" fill="#ffedd5" stroke="#c2410c" stroke-width="1.5"/>
<text x="501" y="234" font-size="11" font-weight="bold" text-anchor="middle" fill="#c2410c">D2</text>
<polyline fill="none" stroke="#111827" stroke-width="2.5" stroke-linejoin="round" points="518,230 570,230"/>
<circle cx="570" cy="230" r="4" fill="#111827"/><circle cx="620" cy="230" r="4" fill="#111827"/>
<polyline fill="none" stroke="#111827" stroke-width="3" stroke-linejoin="round" points="566,212 624,212"/>
<polyline fill="none" stroke="#111827" stroke-width="3" stroke-linejoin="round" points="595,212 595,198"/>
<text x="595" y="254" font-size="12" text-anchor="middle" fill="#374151">button</text>
<polyline fill="none" stroke="#111827" stroke-width="2.5" stroke-linejoin="round" points="620,230 660,230 660,280"/>
<line x1="648.0" y1="280" x2="672.0" y2="280" stroke="#111827" stroke-width="2.5"/>
<line x1="652.0" y1="286" x2="668.0" y2="286" stroke="#111827" stroke-width="2.5"/>
<line x1="656.0" y1="292" x2="664.0" y2="292" stroke="#111827" stroke-width="2.5"/>
<text x="678" y="290" font-size="12" font-weight="bold" fill="#111827">GND</text>
<text x="532" y="110" font-size="13" fill="#374151"><tspan font-weight="bold" fill="#15803d">Released:</tspan> the pull-up</text>
<text x="532" y="128" font-size="13" fill="#374151">holds D2 at 3.3 V → HIGH</text>
<text x="532" y="150" font-size="13" fill="#374151"><tspan font-weight="bold" fill="#1d4ed8">Pressed:</tspan> D2 is joined</text>
<text x="532" y="168" font-size="13" fill="#374151">to GND → LOW</text>
</svg>
