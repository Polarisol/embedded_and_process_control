<text x="92" y="86" font-size="13" font-weight="bold" text-anchor="start" fill="#ffffff">Arduino IDE</text>
<text x="40" y="114" font-size="11.5" font-family="Menlo, Consolas, monospace" fill="#111827" xml:space="preserve"><tspan fill="#00878f" font-weight="bold">void</tspan> setup() {</text>
<text x="40" y="129" font-size="11.5" font-family="Menlo, Consolas, monospace" fill="#111827" xml:space="preserve"><tspan fill="#00878f" font-weight="bold"></tspan>  pinMode(LED_BUILTIN, OUTPUT);</text>
<text x="40" y="144" font-size="11.5" font-family="Menlo, Consolas, monospace" fill="#111827" xml:space="preserve"><tspan fill="#00878f" font-weight="bold"></tspan>}</text>
<text x="40" y="159" font-size="11.5" font-family="Menlo, Consolas, monospace" fill="#111827" xml:space="preserve"><tspan fill="#00878f" font-weight="bold">void</tspan> loop() {</text>
<text x="40" y="174" font-size="11.5" font-family="Menlo, Consolas, monospace" fill="#111827" xml:space="preserve"><tspan fill="#00878f" font-weight="bold"></tspan>  digitalWrite(LED_BUILTIN, HIGH);</text>
<text x="40" y="189" font-size="11.5" font-family="Menlo, Consolas, monospace" fill="#111827" xml:space="preserve"><tspan fill="#00878f" font-weight="bold"></tspan>  delay(500);</text>
<text x="40" y="204" font-size="11.5" font-family="Menlo, Consolas, monospace" fill="#111827" xml:space="preserve"><tspan fill="#00878f" font-weight="bold"></tspan>  digitalWrite(LED_BUILTIN, LOW);</text>
<text x="40" y="219" font-size="11.5" font-family="Menlo, Consolas, monospace" fill="#111827" xml:space="preserve"><tspan fill="#00878f" font-weight="bold"></tspan>  delay(500);</text>
<text x="40" y="234" font-size="11.5" font-family="Menlo, Consolas, monospace" fill="#111827" xml:space="preserve"><tspan fill="#00878f" font-weight="bold"></tspan>}</text>
