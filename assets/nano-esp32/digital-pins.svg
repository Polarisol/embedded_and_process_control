<text x="384" y="554" font-size="13" text-anchor="middle" fill="#374151">Every <tspan font-weight="bold" fill="#c2410c">D</tspan> pin can be an <tspan font-weight="bold">output</tspan>, an <tspan font-weight="bold">input</tspan> or a <tspan font-weight="bold">PWM</tspan> output.</text>
<text x="384" y="572" font-size="13" text-anchor="middle" fill="#374151">HIGH is 3.3 V and LOW is 0 V. Never connect more than 3.3 V to a pin.</text>
