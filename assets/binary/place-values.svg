<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 768 380" width="768" height="380" font-family="Helvetica, Arial, sans-serif">
<rect width="768" height="380" rx="10" fill="#ffffff"/>
<text x="384" y="28" font-size="17" font-weight="bold" text-anchor="middle" fill="#111827">Every digit has a place value</text>
<text x="40" y="60" font-size="14" font-weight="bold" fill="#1d4ed8">Decimal (base 10)</text>
<rect x="200" y="74" width="70" height="56" rx="6" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
<text x="235.0" y="112" font-size="28" font-weight="bold" text-anchor="middle" fill="#111827" font-family="Menlo, Consolas, monospace">3</text>
<text x="235.0" y="152" font-size="13" text-anchor="middle" fill="#374151">× 100</text>
<rect x="284" y="74" width="70" height="56" rx="6" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
<text x="319.0" y="112" font-size="28" font-weight="bold" text-anchor="middle" fill="#111827" font-family="Menlo, Consolas, monospace">5</text>
<text x="319.0" y="152" font-size="13" text-anchor="middle" fill="#374151">× 10</text>
<rect x="368" y="74" width="70" height="56" rx="6" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
<text x="403.0" y="112" font-size="28" font-weight="bold" text-anchor="middle" fill="#111827" font-family="Menlo, Consolas, monospace">2</text>
<text x="403.0" y="152" font-size="13" text-anchor="middle" fill="#374151">× 1</text>
<text x="40" y="108" font-size="12" fill="#374151">10 digits: 0–9</text>
<text x="384" y="182" font-size="15" text-anchor="middle" fill="#111827">3×100 + 5×10 + 2×1 = <tspan font-weight="bold">352</tspan></text>
<text x="40" y="210" font-size="14" font-weight="bold" fill="#15803d">Binary (base 2)</text>
<rect x="200" y="224" width="70" height="56" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
<text x="235.0" y="262" font-size="28" font-weight="bold" text-anchor="middle" fill="#111827" font-family="Menlo, Consolas, monospace">1</text>
<text x="235.0" y="302" font-size="13" text-anchor="middle" fill="#374151">× 8</text>
<rect x="284" y="224" width="70" height="56" rx="6" fill="#f3f4f6" stroke="#15803d" stroke-width="2"/>
<text x="319.0" y="262" font-size="28" font-weight="bold" text-anchor="middle" fill="#111827" font-family="Menlo, Consolas, monospace">0</text>
<text x="319.0" y="302" font-size="13" text-anchor="middle" fill="#374151">× 4</text>
<rect x="368" y="224" width="70" height="56" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
<text x="403.0" y="262" font-size="28" font-weight="bold" text-anchor="middle" fill="#111827" font-family="Menlo, Consolas, monospace">1</text>
<text x="403.0" y="302" font-size="13" text-anchor="middle" fill="#374151">× 2</text>
<rect x="452" y="224" width="70" height="56" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
<text x="487.0" y="262" font-size="28" font-weight="bold" text-anchor="middle" fill="#111827" font-family="Menlo, Consolas, monospace">1</text>
<text x="487.0" y="302" font-size="13" text-anchor="middle" fill="#374151">× 1</text>
<text x="40" y="258" font-size="12" fill="#374151">2 digits: 0 and 1</text>
<text x="384" y="332" font-size="15" text-anchor="middle" fill="#111827">1×8 + 0×4 + 1×2 + 1×1 = <tspan font-weight="bold">11</tspan></text>
<text x="384" y="364" font-size="12" text-anchor="middle" fill="#374151">In decimal each place is worth 10 times the one to its right. In binary it is worth 2 times.</text>
</svg>
