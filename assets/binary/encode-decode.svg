<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 768 300" width="768" height="300" font-family="Helvetica, Arial, sans-serif">
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker>
</defs>
<rect width="768" height="300" rx="10" fill="#ffffff"/>
<text x="384" y="28" font-size="17" font-weight="bold" text-anchor="middle" fill="#111827">A str holds characters, a bytes object holds numbers</text>
<text x="120" y="62" font-size="12" font-weight="bold" text-anchor="middle" fill="#6b7280">str (TEXT)</text>
<rect x="30" y="74" width="180" height="60" rx="8" fill="#f9fafb" stroke="#1d4ed8" stroke-width="2"/>
<text x="120" y="112" font-size="24" font-weight="bold" text-anchor="middle" fill="#111827" font-family="Menlo, Consolas, monospace">"Hi!"</text>
<text x="555" y="62" font-size="12" font-weight="bold" text-anchor="middle" fill="#6b7280">bytes (NUMBERS 0–255)</text>
<rect x="400" y="74" width="100" height="60" rx="5" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
<text x="450" y="104" font-size="22" font-weight="bold" text-anchor="middle" fill="#111827" font-family="Menlo, Consolas, monospace">72</text>
<text x="450" y="124" font-size="12" text-anchor="middle" fill="#374151" font-family="Menlo, Consolas, monospace">01001000</text>
<rect x="506" y="74" width="100" height="60" rx="5" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
<text x="556" y="104" font-size="22" font-weight="bold" text-anchor="middle" fill="#111827" font-family="Menlo, Consolas, monospace">105</text>
<text x="556" y="124" font-size="12" text-anchor="middle" fill="#374151" font-family="Menlo, Consolas, monospace">01101001</text>
<rect x="612" y="74" width="100" height="60" rx="5" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
<text x="662" y="104" font-size="22" font-weight="bold" text-anchor="middle" fill="#111827" font-family="Menlo, Consolas, monospace">33</text>
<text x="662" y="124" font-size="12" text-anchor="middle" fill="#374151" font-family="Menlo, Consolas, monospace">00100001</text>
<line x1="222" y1="88" x2="388" y2="88" stroke="#374151" stroke-width="2" marker-end="url(#ah)"/>
<text x="305" y="80" font-size="14" font-weight="bold" text-anchor="middle" fill="#1d4ed8" font-family="Menlo, Consolas, monospace">.encode('utf-8')</text>
<line x1="388" y1="122" x2="222" y2="122" stroke="#374151" stroke-width="2" marker-end="url(#ah)"/>
<text x="305" y="144" font-size="14" font-weight="bold" text-anchor="middle" fill="#15803d" font-family="Menlo, Consolas, monospace">.decode('utf-8')</text>
<text x="40" y="190" font-size="12" font-weight="bold" fill="#6b7280">THE SAME 3 BYTES, SHOWN 3 WAYS</text>
<text x="40" y="218" font-size="14" fill="#374151">Python prints them:</text>
<text x="250" y="218" font-size="15" font-weight="bold" fill="#111827" font-family="Menlo, Consolas, monospace">b'Hi!'</text>
<text x="500" y="218" font-size="13" fill="#6b7280">as ASCII characters</text>
<text x="40" y="246" font-size="14" fill="#374151">list(b):</text>
<text x="250" y="246" font-size="15" font-weight="bold" fill="#111827" font-family="Menlo, Consolas, monospace">[72, 105, 33]</text>
<text x="500" y="246" font-size="13" fill="#6b7280">as decimal numbers</text>
<text x="40" y="274" font-size="14" fill="#374151">b.hex(' '):</text>
<text x="250" y="274" font-size="15" font-weight="bold" fill="#111827" font-family="Menlo, Consolas, monospace">48 69 21</text>
<text x="500" y="274" font-size="13" fill="#6b7280">as hexadecimal</text>
</svg>
