<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 768 330" width="768" height="330" font-family="Helvetica, Arial, sans-serif">
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#111827"/></marker>
<marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker>
</defs>
<rect width="768" height="330" rx="10" fill="#ffffff"/>
<text x="384" y="28" font-size="17" font-weight="bold" text-anchor="middle" fill="#111827">What an LED looks like, and how it is drawn in a circuit</text>
<!-- real LED -->
<text x="190" y="58" font-size="14" font-weight="bold" text-anchor="middle" fill="#1d4ed8">The real part</text>
<path d="M150,190 L150,112 A40,40 0 0 1 230,112 L230,190 Z" fill="#fecaca" stroke="#b42318" stroke-width="2"/>
<path d="M142,190 L232,190 L232,204 L142,204 Z" fill="#fca5a5" stroke="#b42318" stroke-width="2"/>
<line x1="232" y1="186" x2="232" y2="208" stroke="#b42318" stroke-width="4"/>
<!-- inside: anode post and cathode anvil -->
<rect x="166" y="132" width="6" height="58" fill="#6b7280"/>
<polygon points="194,150 222,140 222,166 212,166 212,190 204,190 204,166 194,166" fill="#6b7280"/>
<rect x="204" y="134" width="10" height="8" fill="#111827"/>
<path d="M169,132 Q180,112 207,134" fill="none" stroke="#6b7280" stroke-width="1.5"/>
<!-- legs -->
<rect x="166" y="204" width="6" height="100" fill="#9ca3af"/>
<rect x="205" y="204" width="6" height="66" fill="#9ca3af"/>
<!-- labels -->
<text x="158" y="282" font-size="13" font-weight="bold" text-anchor="end" fill="#b42318">Anode (+)</text>
<text x="158" y="298" font-size="12" text-anchor="end" fill="#374151">long leg</text>
<text x="220" y="250" font-size="13" font-weight="bold" fill="#111827">Cathode (−)</text>
<text x="220" y="266" font-size="12" fill="#374151">short leg</text>
<line x1="290" y1="198" x2="240" y2="198" stroke="#111827" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="296" y="194" font-size="12" fill="#374151">flat edge on the rim</text>
<text x="296" y="209" font-size="12" fill="#374151">= cathode side</text>
<line x1="290" y1="120" x2="218" y2="136" stroke="#111827" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="296" y="116" font-size="12" fill="#374151">tiny LED chip</text>
<text x="296" y="131" font-size="12" fill="#374151">(this is what glows)</text>
<line x1="100" y1="96" x2="150" y2="110" stroke="#111827" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="96" y="92" font-size="12" text-anchor="end" fill="#374151">plastic lens</text>
<!-- divider -->
<line x1="424" y1="50" x2="424" y2="310" stroke="#e5e7eb" stroke-width="2"/>
<!-- symbol -->
<text x="600" y="58" font-size="14" font-weight="bold" text-anchor="middle" fill="#1d4ed8">The circuit symbol</text>
<line x1="460" y1="170" x2="570" y2="170" stroke="#111827" stroke-width="2.5"/>
<polygon points="570,140 570,200 620,170" fill="#fecaca" stroke="#111827" stroke-width="2.5" stroke-linejoin="round"/>
<line x1="620" y1="140" x2="620" y2="200" stroke="#111827" stroke-width="3"/>
<line x1="620" y1="170" x2="740" y2="170" stroke="#111827" stroke-width="2.5"/>
<line x1="592" y1="134" x2="612" y2="106" stroke="#d97706" stroke-width="2" marker-end="url(#ag)"/>
<line x1="608" y1="140" x2="628" y2="112" stroke="#d97706" stroke-width="2" marker-end="url(#ag)"/>
<text x="634" y="104" font-size="12" fill="#d97706">light</text>
<circle cx="460" cy="170" r="4" fill="#111827"/>
<circle cx="740" cy="170" r="4" fill="#111827"/>
<text x="500" y="196" font-size="13" font-weight="bold" text-anchor="middle" fill="#b42318">Anode (+)</text>
<text x="690" y="196" font-size="13" font-weight="bold" text-anchor="middle" fill="#111827">Cathode (−)</text>
<line x1="490" y1="236" x2="710" y2="236" stroke="#15803d" stroke-width="2.5" marker-end="url(#ar)"/>
<text x="600" y="226" font-size="13" text-anchor="middle" fill="#15803d">current flows this way only</text>
<text x="600" y="268" font-size="12" text-anchor="middle" fill="#374151">The triangle points the way current flows.</text>
<text x="600" y="286" font-size="12" text-anchor="middle" fill="#374151">The bar is the cathode, just like the flat edge.</text>
</svg>
