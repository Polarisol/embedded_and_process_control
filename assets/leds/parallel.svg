<rect x="30" y="242" width="16" height="16" fill="#111827"/><text x="38" y="276" font-size="13" font-weight="bold" text-anchor="middle" fill="#111827">GND</text>
<text x="125" y="82" font-size="13" font-weight="bold" text-anchor="middle" fill="#111827">R</text>
<text x="166" y="160" font-size="13" font-weight="bold" text-anchor="end" fill="#b42318">red</text>
<text x="166" y="176" font-size="12" text-anchor="end" fill="#374151">2.0 V</text>
<text x="326" y="160" font-size="13" font-weight="bold" text-anchor="start" fill="#15803d">green</text>
<text x="326" y="176" font-size="12" text-anchor="start" fill="#374151">3.0 V</text>
<text x="194" y="298" font-size="13" text-anchor="middle" fill="#374151">The red LED holds the voltage at 2.0 V.</text>
<text x="194" y="316" font-size="13" text-anchor="middle" fill="#374151">Green needs 3.0 V, so it stays dark,</text>
<text x="194" y="334" font-size="13" text-anchor="middle" fill="#374151">and red takes all the current.</text>
<rect x="392" y="44" width="364" height="304" rx="8" fill="#dff3e4"/>
<text x="574" y="68" font-size="15" font-weight="bold" text-anchor="middle" fill="#15803d">✓  One resistor per LED</text>
<rect x="410" y="92" width="16" height="16" fill="#1d4ed8"/><text x="418" y="86" font-size="13" font-weight="bold" text-anchor="middle" fill="#1d4ed8">D2</text>
