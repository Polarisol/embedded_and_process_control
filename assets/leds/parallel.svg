<text x="666" y="144" font-size="12" text-anchor="end" fill="#374151">33 Ω</text>
<line x1="562" y1="158" x2="562" y2="176" stroke="#111827" stroke-width="2.5"/>
<line x1="682" y1="158" x2="682" y2="176" stroke="#111827" stroke-width="2.5"/>
