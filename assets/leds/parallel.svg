<text x="194" y="68" font-size="15" font-weight="bold" text-anchor="middle" fill="#b42318">✗  One resistor for both</text>
<rect x="30" y="92" width="16" height="16" fill="#1d4ed8"/><text x="38" y="86" font-size="13" font-weight="bold" text-anchor="middle" fill="#1d4ed8">D2</text>
<line x1="46" y1="100" x2="90" y2="100" stroke="#111827" stroke-width="2.5"/>
