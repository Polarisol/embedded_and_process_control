<rect x="410" y="242" width="16" height="16" fill="#111827"/><text x="418" y="276" font-size="13" font-weight="bold" text-anchor="middle" fill="#111827">GND</text>
<text x="524" y="200" font-size="13" font-weight="bold" text-anchor="end" fill="#b42318">red</text>
<text x="708" y="200" font-size="13" font-weight="bold" text-anchor="start" fill="#15803d">green</text>
<text x="574" y="298" font-size="13" text-anchor="middle" fill="#374151">Each resistor sets the current for its own LED.</text>
<text x="574" y="316" font-size="13" text-anchor="middle" fill="#374151">Both LEDs light up, each at the brightness</text>
<text x="574" y="334" font-size="13" text-anchor="middle" fill="#374151">you calculated.</text>
</svg>
