<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 768 360" width="768" height="360" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#15803d"/></marker></defs>
<rect width="768" height="360" rx="10" fill="#ffffff"/>
<text x="384" y="28" font-size="17" font-weight="bold" text-anchor="middle" fill="#111827">Two LEDs: one shared resistor vs. one resistor each</text>
