<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 768 440" width="768" height="440" font-family="Helvetica, Arial, sans-serif">
<defs>
<marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/></marker>
<marker id="ay" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker>
</defs>
<rect width="768" height="440" rx="10" fill="#ffffff"/>
<text x="384" y="28" font-size="17" font-weight="bold" text-anchor="middle" fill="#111827">How an LED makes light</text>
<rect x="90" y="100" width="280" height="120" fill="#fde2e1" stroke="#b42318" stroke-width="2"/>
<rect x="370" y="100" width="280" height="120" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
<line x1="370" y1="96" x2="370" y2="224" stroke="#111827" stroke-width="2" stroke-dasharray="5 4"/>
<text x="230" y="120" font-size="13" font-weight="bold" text-anchor="middle" fill="#b42318">P side: "holes" (missing electrons)</text>
<text x="510" y="120" font-size="13" font-weight="bold" text-anchor="middle" fill="#1d4ed8">N side: extra electrons</text>
<circle cx="130" cy="150" r="9" fill="#ffffff" stroke="#b42318" stroke-width="2"/>
<circle cx="190" cy="185" r="9" fill="#ffffff" stroke="#b42318" stroke-width="2"/>
<circle cx="250" cy="150" r="9" fill="#ffffff" stroke="#b42318" stroke-width="2"/>
<circle cx="150" cy="200" r="9" fill="#ffffff" stroke="#b42318" stroke-width="2"/>
<circle cx="300" cy="190" r="9" fill="#ffffff" stroke="#b42318" stroke-width="2"/>
<circle cx="340" cy="160" r="9" fill="#ffffff" stroke="#b42318" stroke-width="2"/>
<circle cx="560" cy="150" r="9" fill="#1d4ed8"/><text x="560" y="154" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">−</text>
<circle cx="620" cy="185" r="9" fill="#1d4ed8"/><text x="620" y="189" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">−</text>
<circle cx="480" cy="190" r="9" fill="#1d4ed8"/><text x="480" y="194" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">−</text>
<circle cx="600" cy="145" r="9" fill="#1d4ed8"/><text x="600" y="149" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">−</text>
<circle cx="520" cy="205" r="9" fill="#1d4ed8"/><text x="520" y="209" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">−</text>
<circle cx="440" cy="155" r="9" fill="#1d4ed8"/><text x="440" y="159" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">−</text>
<path d="M426,160 L356,160" stroke="#1d4ed8" stroke-width="2" fill="none" marker-end="url(#ab)"/>
<path d="M352,146 q7,-5.0 0,-10 q-7,-5.0 0,-10 q7,-5.0 0,-10 q-7,-5.0 0,-10 q7,-5.0 0,-10 q-7,-5.0 0,-10 q7,-5.0 0,-10 q-7,-5.0 0,-10" stroke="#d97706" stroke-width="2.5" fill="none" marker-end="url(#ay)"/>
<text x="372" y="64" font-size="13" font-weight="bold" fill="#d97706">a flash of light</text>
<text x="372" y="80" font-size="12" fill="#374151">(a photon)</text>
<line x1="40" y1="160" x2="90" y2="160" stroke="#111827" stroke-width="2.5"/>
<line x1="650" y1="160" x2="720" y2="160" stroke="#111827" stroke-width="2.5"/>
<text x="40" y="150" font-size="13" font-weight="bold" fill="#b42318">+</text>
<text x="40" y="186" font-size="12" fill="#374151">anode</text>
<text x="720" y="150" font-size="13" font-weight="bold" text-anchor="end" fill="#111827">−</text>
<text x="720" y="186" font-size="12" text-anchor="end" fill="#374151">cathode</text>
<text x="384" y="246" font-size="13" text-anchor="middle" fill="#374151">The voltage pushes electrons across the junction. When an electron drops into a hole,</text>
<text x="384" y="264" font-size="13" text-anchor="middle" fill="#374151">it gives away its extra energy as light.</text>
<line x1="40" y1="282" x2="728" y2="282" stroke="#e5e7eb" stroke-width="2"/>
<text x="384" y="306" font-size="14" font-weight="bold" text-anchor="middle" fill="#111827">A bigger energy step makes bluer light, and needs more voltage</text>
<rect x="60" y="318" width="140" height="110" rx="8" fill="#f9fafb" stroke="#e5e7eb"/>
<text x="130" y="338" font-size="13" font-weight="bold" text-anchor="middle" fill="#dc2626">Red</text>
<line x1="80" y1="372" x2="120" y2="372" stroke="#111827" stroke-width="2.5"/>
<line x1="80" y1="398" x2="120" y2="398" stroke="#111827" stroke-width="2.5"/>
<path d="M100,375 L100,393" stroke="#dc2626" stroke-width="3"/><path d="M94,388 L100,396 L106,388" fill="none" stroke="#dc2626" stroke-width="3"/>
<path d="M124,385 q6,-4 12,0 q6,4 12,0 q6,-4 12,0 q6,4 12,0" stroke="#dc2626" stroke-width="2.5" fill="none"/>
<text x="130" y="418" font-size="13" text-anchor="middle" fill="#111827">≈ 2.0 V</text>
<rect x="228" y="318" width="140" height="110" rx="8" fill="#f9fafb" stroke="#e5e7eb"/>
<text x="298" y="338" font-size="13" font-weight="bold" text-anchor="middle" fill="#ca8a04">Yellow</text>
<line x1="248" y1="366" x2="288" y2="366" stroke="#111827" stroke-width="2.5"/>
<line x1="248" y1="398" x2="288" y2="398" stroke="#111827" stroke-width="2.5"/>
<path d="M268,369 L268,393" stroke="#ca8a04" stroke-width="3"/><path d="M262,388 L268,396 L274,388" fill="none" stroke="#ca8a04" stroke-width="3"/>
<path d="M292,382 q6,-4 12,0 q6,4 12,0 q6,-4 12,0 q6,4 12,0" stroke="#ca8a04" stroke-width="2.5" fill="none"/>
<text x="298" y="418" font-size="13" text-anchor="middle" fill="#111827">≈ 2.1 V</text>
<rect x="396" y="318" width="140" height="110" rx="8" fill="#f9fafb" stroke="#e5e7eb"/>
<text x="466" y="338" font-size="13" font-weight="bold" text-anchor="middle" fill="#16a34a">Green</text>
<line x1="416" y1="356" x2="456" y2="356" stroke="#111827" stroke-width="2.5"/>
<line x1="416" y1="398" x2="456" y2="398" stroke="#111827" stroke-width="2.5"/>
<path d="M436,359 L436,393" stroke="#16a34a" stroke-width="3"/><path d="M430,388 L436,396 L442,388" fill="none" stroke="#16a34a" stroke-width="3"/>
<path d="M460,377 q6,-4 12,0 q6,4 12,0 q6,-4 12,0 q6,4 12,0" stroke="#16a34a" stroke-width="2.5" fill="none"/>
<text x="466" y="418" font-size="13" text-anchor="middle" fill="#111827">≈ 2.1 – 3.0 V</text>
<rect x="564" y="318" width="140" height="110" rx="8" fill="#f9fafb" stroke="#e5e7eb"/>
<text x="634" y="338" font-size="13" font-weight="bold" text-anchor="middle" fill="#2563eb">Blue / White</text>
<line x1="584" y1="346" x2="624" y2="346" stroke="#111827" stroke-width="2.5"/>
<line x1="584" y1="398" x2="624" y2="398" stroke="#111827" stroke-width="2.5"/>
<path d="M604,349 L604,393" stroke="#2563eb" stroke-width="3"/><path d="M598,388 L604,396 L610,388" fill="none" stroke="#2563eb" stroke-width="3"/>
<path d="M628,372 q6,-4 12,0 q6,4 12,0 q6,-4 12,0 q6,4 12,0" stroke="#2563eb" stroke-width="2.5" fill="none"/>
<text x="634" y="418" font-size="13" text-anchor="middle" fill="#111827">≈ 3.0 V</text>
</svg>
