<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 768 330" width="768" height="330" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#15803d"/></marker></defs>
<rect width="768" height="330" rx="10" fill="#ffffff"/>
<text x="384" y="28" font-size="17" font-weight="bold" text-anchor="middle" fill="#111827">One LED, one resistor</text>
<rect x="20" y="56" width="190" height="220" rx="10" fill="#e0ecfb" stroke="#1d4ed8" stroke-width="2"/>
<text x="115" y="82" font-size="15" font-weight="bold" text-anchor="middle" fill="#1d4ed8">Arduino</text>
<text x="115" y="100" font-size="15" font-weight="bold" text-anchor="middle" fill="#1d4ed8">Nano ESP32</text>
<rect x="196" y="112" width="16" height="16" fill="#1d4ed8"/><rect x="196" y="232" width="16" height="16" fill="#111827"/>
<text x="188" y="125" font-size="13" font-weight="bold" text-anchor="end" fill="#1d4ed8">D2</text>
<text x="188" y="145" font-size="12" text-anchor="end" fill="#374151">HIGH = 3.3 V</text>
<text x="188" y="245" font-size="13" font-weight="bold" text-anchor="end" fill="#111827">GND = 0 V</text>
<line x1="212" y1="120" x2="280" y2="120" stroke="#111827" stroke-width="2.5"/>
<polyline fill="none" stroke="#111827" stroke-width="2.5" stroke-linejoin="round" points="280,120 283.3,128 290.0,112 296.7,128 303.3,112 310.0,128 316.7,112 323.3,128 330.0,112 336.7,128 343.3,112 350.0,128 356.7,112 360,120"/>
<line x1="360" y1="120" x2="430" y2="120" stroke="#111827" stroke-width="2.5"/>
<polygon points="430,102 430,138 464,120" fill="#fecaca" stroke="#111827" stroke-width="2.5" stroke-linejoin="round"/>
<line x1="464" y1="102" x2="464" y2="138" stroke="#111827" stroke-width="3"/>
<line x1="464" y1="120" x2="530" y2="120" stroke="#111827" stroke-width="2.5"/>
<line x1="530" y1="120" x2="530" y2="240" stroke="#111827" stroke-width="2.5"/>
<line x1="530" y1="240" x2="212" y2="240" stroke="#111827" stroke-width="2.5"/>
<text x="320" y="96" font-size="14" font-weight="bold" text-anchor="middle" fill="#111827">R = 150 Ω</text>
<text x="320" y="152" font-size="14" font-weight="bold" text-anchor="middle" fill="#b42318">1.3 V</text>
<text x="447" y="92" font-size="14" font-weight="bold" text-anchor="middle" fill="#111827">red LED</text>
<text x="447" y="158" font-size="14" font-weight="bold" text-anchor="middle" fill="#b42318">2.0 V</text>
<line x1="470" y1="262" x2="290" y2="262" stroke="#15803d" stroke-width="2.5" marker-end="url(#ar)"/>
<text x="380" y="282" font-size="12" text-anchor="middle" fill="#15803d">the same current ≈ 9 mA flows through both</text>
<text x="384" y="312" font-size="13" text-anchor="middle" fill="#374151">The 3.3 V from the pin is shared: 2.0 V for the LED and 1.3 V for the resistor.</text>
<rect x="560" y="56" width="190" height="200" rx="8" fill="#dff3e4"/>
<text x="655" y="82" font-size="14" font-weight="bold" text-anchor="middle" fill="#15803d">The calculation</text>
<text x="655" y="110" font-size="14" font-weight="bold" text-anchor="middle" fill="#111827">R = (V − V_LED) / I</text>
<text x="655" y="138" font-size="14" text-anchor="middle" fill="#111827">= (3.3 − 2.0) / 0.010</text>
<text x="655" y="166" font-size="14" text-anchor="middle" fill="#111827">= 130 Ω</text>
<text x="655" y="200" font-size="13" text-anchor="middle" fill="#374151">Round up to a</text>
<text x="655" y="220" font-size="13" text-anchor="middle" fill="#374151">standard value:</text>
<text x="655" y="244" font-size="15" font-weight="bold" text-anchor="middle" fill="#111827">150 Ω</text>
</svg>
