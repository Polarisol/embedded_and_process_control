<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 768 330" width="768" height="330" font-family="Helvetica, Arial, sans-serif">
<defs>
  <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#111827"/></marker>
  <marker id="r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b42318"/></marker>
  <marker id="g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15803d"/></marker>
</defs>
<rect width="768" height="330" rx="10" fill="#ffffff"/>

<!-- Left: the trap -->
<rect x="16" y="16" width="360" height="298" rx="10" fill="#fdf2f2" stroke="#f3c5c2"/>
<text x="196" y="44" font-size="17" font-weight="bold" text-anchor="middle" fill="#b42318">✗  Your own while-loop</text>
<rect x="56" y="70" width="280" height="44" rx="8" fill="#fde2e1" stroke="#b42318" stroke-width="1.5"/>
<text x="196" y="97" font-size="15" text-anchor="middle" fill="#111827" font-family="Menlo, Consolas, monospace">line = ser.readline()</text>
<path d="M336,92 C380,92 380,150 336,150 L56,150 C12,150 12,92 52,92" fill="none" stroke="#b42318" stroke-width="2.5" marker-end="url(#r)"/>
<text x="196" y="143" font-size="13" text-anchor="middle" fill="#b42318">waits… and waits… forever</text>
<rect x="76" y="180" width="240" height="110" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/>
<rect x="76" y="180" width="240" height="24" rx="8" fill="#e5e7eb"/>
<text x="196" y="197" font-size="12" text-anchor="middle" fill="#6b7280">My App (Not Responding)</text>
<text x="196" y="246" font-size="34" text-anchor="middle">🥶</text>
<text x="196" y="276" font-size="13" text-anchor="middle" fill="#6b7280">buttons dead, window frozen</text>

<!-- Right: the Qt way -->
<rect x="392" y="16" width="360" height="298" rx="10" fill="#effaf2" stroke="#bfe6c9"/>
<text x="572" y="44" font-size="17" font-weight="bold" text-anchor="middle" fill="#15803d">✓  Qt's event loop does the waiting</text>
<circle cx="572" cy="170" r="62" fill="#dff3e4" stroke="#15803d" stroke-width="2.5"/>
<text x="572" y="165" font-size="15" font-weight="bold" text-anchor="middle" fill="#111827">app.exec()</text>
<text x="572" y="185" font-size="12" text-anchor="middle" fill="#374151">event loop</text>
<path d="M560,108 A62,62 0 0 1 625,138" fill="none" stroke="#15803d" stroke-width="3" marker-end="url(#g)"/>
<!-- events in -->
<text x="408" y="88" font-size="13" fill="#374151">🖱 click</text>
<text x="408" y="176" font-size="13" fill="#374151">⌨ key</text>
<text x="408" y="264" font-size="13" font-weight="bold" fill="#1d4ed8">⇄ bytes</text>
<path d="M462,90 L515,130" stroke="#111827" stroke-width="1.5" marker-end="url(#a)"/>
<path d="M452,172 L505,172" stroke="#111827" stroke-width="1.5" marker-end="url(#a)"/>
<path d="M466,258 L515,212" stroke="#1d4ed8" stroke-width="2" marker-end="url(#a)"/>
<!-- slot out -->
<path d="M626,200 L654,226" stroke="#1d4ed8" stroke-width="2" marker-end="url(#a)"/>
<rect x="602" y="230" width="140" height="58" rx="8" fill="#e0ecfb" stroke="#1d4ed8" stroke-width="1.5"/>
<text x="672" y="252" font-size="12" text-anchor="middle" fill="#1d4ed8">readyRead ➜</text>
<text x="672" y="274" font-size="14" text-anchor="middle" fill="#111827" font-family="Menlo, Consolas, monospace">receive()</text>
<text x="690" y="96" font-size="30" text-anchor="middle">😎</text>
<text x="690" y="124" font-size="12" text-anchor="middle" fill="#15803d">GUI stays alive</text>
</svg>
