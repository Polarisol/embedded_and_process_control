<path d="M650,308 A40,40 0 0 1 730,308" fill="#eef0f2" stroke="#9ca3af" stroke-width="1.5"/>
<line x1="690" y1="308" x2="656.0" y2="308.0" stroke="#1d4ed8" stroke-width="6" stroke-linecap="round"/>
<circle cx="690" cy="308" r="5" fill="#1d4ed8"/>
<text x="690.0" y="328.0" font-size="13" font-weight="bold" text-anchor="middle" fill="#1d4ed8">180°</text>
<line x1="166.0" y1="60" x2="560.5" y2="60" stroke="#374151" stroke-width="1.3" marker-start="url(#ah)" marker-end="url(#ah)"/>
<text x="363.3" y="54.0" font-size="11" font-weight="bold" text-anchor="middle" fill="#374151">T = 20 ms (50 Hz), always the same</text>
<text x="384.0" y="344.0" font-size="13" text-anchor="middle" fill="#374151">Most of the time the pin is LOW. The servo measures only how long each pulse is,</text>
<text x="384.0" y="362.0" font-size="13" text-anchor="middle" fill="#374151">so the average voltage tells it nothing. (Values for an SG90; other servos differ a little.)</text>
