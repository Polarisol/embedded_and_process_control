<text x="24.0" y="114.0" font-size="12" text-anchor="start" fill="#1d4ed8">duty 2.5 %</text>
<text x="158.0" y="80.0" font-size="11" text-anchor="end" fill="#374151">3.3 V</text>
<text x="158.0" y="130.0" font-size="11" text-anchor="end" fill="#374151">0 V</text>
<polyline fill="none" stroke="#a16207" stroke-width="2.5" stroke-linejoin="round" points="166.0,126.0 166.0,126.0 166.0,76.0 175.9,76.0 175.9,126.0 560.5,126.0 560.5,76.0 570.4,76.0 570.4,126.0 600.0,126.0"/>
<text x="181.9" y="90.0" font-size="13" font-weight="bold" text-anchor="start" fill="#a16207">0.5 ms</text>
<path d="M650,124 A40,40 0 0 1 730,124" fill="#eef0f2" stroke="#9ca3af" stroke-width="1.5"/>
<line x1="690" y1="124" x2="724.0" y2="124.0" stroke="#1d4ed8" stroke-width="6" stroke-linecap="round"/>
<circle cx="690" cy="124" r="5" fill="#1d4ed8"/>
