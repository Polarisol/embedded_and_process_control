<circle cx="690" cy="216" r="5" fill="#1d4ed8"/>
<text x="690.0" y="236.0" font-size="13" font-weight="bold" text-anchor="middle" fill="#1d4ed8">90°</text>
<text x="24.0" y="278.0" font-size="15" font-weight="bold" text-anchor="start" fill="#111827">2.4 ms pulse</text>
<text x="24.0" y="298.0" font-size="12" text-anchor="start" fill="#1d4ed8">duty 12 %</text>
<text x="158.0" y="264.0" font-size="11" text-anchor="end" fill="#374151">3.3 V</text>
<text x="158.0" y="314.0" font-size="11" text-anchor="end" fill="#374151">0 V</text>
<polyline fill="none" stroke="#a16207" stroke-width="2.5" stroke-linejoin="round" points="166.0,310.0 166.0,310.0 166.0,260.0 213.3,260.0 213.3,310.0 560.5,310.0 560.5,260.0 600.0,260.0"/>
