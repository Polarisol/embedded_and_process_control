<text x="24.0" y="186.0" font-size="15" font-weight="bold" text-anchor="start" fill="#111827">1.5 ms pulse</text>
<text x="24.0" y="206.0" font-size="12" text-anchor="start" fill="#1d4ed8">duty 7.5 %</text>
<text x="158.0" y="172.0" font-size="11" text-anchor="end" fill="#374151">3.3 V</text>
<text x="158.0" y="222.0" font-size="11" text-anchor="end" fill="#374151">0 V</text>
<polyline fill="none" stroke="#a16207" stroke-width="2.5" stroke-linejoin="round" points="166.0,218.0 166.0,218.0 166.0,168.0 195.6,168.0 195.6,218.0 560.5,218.0 560.5,168.0 590.1,168.0 590.1,218.0 600.0,218.0"/>
