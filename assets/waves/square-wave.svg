<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 768 330" width="768" height="330" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker></defs>
<rect width="768" height="330" rx="10" fill="#ffffff"/>
<text x="384.0" y="28" font-size="17" font-weight="bold" text-anchor="middle" fill="#111827">A square wave and its three numbers</text>
<text x="132.0" y="94.0" font-size="11" text-anchor="end" fill="#374151">3.3 V</text>
<text x="132.0" y="174.0" font-size="11" text-anchor="end" fill="#374151">0 V</text>
<text x="680.0" y="194.0" font-size="11" text-anchor="end" fill="#374151">time →</text>
<line x1="140" y1="60" x2="140" y2="178" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4 3"/>
<line x1="320" y1="60" x2="320" y2="178" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4 3"/>
<line x1="500" y1="60" x2="500" y2="178" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4 3"/>
<line x1="680" y1="60" x2="680" y2="178" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4 3"/>
<polyline fill="none" stroke="#15803d" stroke-width="2.5" stroke-linejoin="round" points="140.0,170.0 140.0,170.0 140.0,90.0 185.0,90.0 185.0,170.0 320.0,170.0 320.0,90.0 365.0,90.0 365.0,170.0 500.0,170.0 500.0,90.0 545.0,90.0 545.0,170.0 680.0,170.0"/>
<line x1="140.0" y1="80" x2="185.0" y2="80" stroke="#a16207" stroke-width="1.3" marker-start="url(#ah)" marker-end="url(#ah)"/>
<text x="162.5" y="74.0" font-size="12" font-weight="bold" text-anchor="middle" fill="#a16207">high time</text>
<line x1="140.0" y1="186" x2="320.0" y2="186" stroke="#1d4ed8" stroke-width="1.3" marker-start="url(#ah)" marker-end="url(#ah)"/>
<text x="230.0" y="202.0" font-size="12" font-weight="bold" text-anchor="middle" fill="#1d4ed8">period T (one full cycle)</text>
<line x1="185.0" y1="160" x2="320.0" y2="160" stroke="#374151" stroke-width="1.3" marker-start="url(#ah)" marker-end="url(#ah)"/>
<text x="252.5" y="154.0" font-size="12" font-weight="bold" text-anchor="middle" fill="#374151">low time</text>
<rect x="40" y="236" width="190" height="72" rx="8" fill="#eef0f2"/>
<text x="135.0" y="258.0" font-size="14" font-weight="bold" text-anchor="middle" fill="#1d4ed8">Period T</text>
<text x="135.0" y="276.0" font-size="12" text-anchor="middle" fill="#374151">time of one cycle</text>
<text x="135.0" y="296.0" font-size="12" font-weight="bold" font-family="Courier New, monospace" text-anchor="middle" fill="#111827">T = 1 ms</text>
<rect x="290" y="236" width="190" height="72" rx="8" fill="#eef0f2"/>
<text x="385.0" y="258.0" font-size="14" font-weight="bold" text-anchor="middle" fill="#1d4ed8">Frequency f</text>
<text x="385.0" y="276.0" font-size="12" text-anchor="middle" fill="#374151">cycles every second</text>
<text x="385.0" y="296.0" font-size="12" font-weight="bold" font-family="Courier New, monospace" text-anchor="middle" fill="#111827">f = 1 / T = 1000 Hz</text>
<rect x="540" y="236" width="190" height="72" rx="8" fill="#eef0f2"/>
<text x="635.0" y="258.0" font-size="14" font-weight="bold" text-anchor="middle" fill="#a16207">Duty cycle</text>
<text x="635.0" y="276.0" font-size="12" text-anchor="middle" fill="#374151">share of T that is high</text>
<text x="635.0" y="296.0" font-size="12" font-weight="bold" font-family="Courier New, monospace" text-anchor="middle" fill="#111827">0.25 ms / 1 ms = 25 %</text>
</svg>
