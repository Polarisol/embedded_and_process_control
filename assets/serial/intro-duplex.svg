<text x="305.0" y="277.0" font-size="15" font-weight="bold" text-anchor="middle" fill="#111827">Device A</text>
<rect x="634" y="244" width="110" height="56" rx="8" fill="#eef0f2" stroke="#111827" stroke-width="2"/>
<text x="689.0" y="277.0" font-size="15" font-weight="bold" text-anchor="middle" fill="#111827">Device B</text>
