<text x="497" y="172" font-size="13" text-anchor="middle" fill="#a16207">one shared wire, take turns</text>
<text x="497" y="202" font-size="12" text-anchor="middle" fill="#6b7280">RS-485, I²C, walkie-talkie</text>
