<text x="671.0" y="228.0" font-size="12" text-anchor="middle" fill="#b42318">hi</text>
<text x="24" y="278" font-size="13" text-anchor="start" fill="#6b7280">Low byte first (little-endian), the same order the ESP32 and your PC use in memory</text>
<line x1="24" y1="300" x2="744" y2="300" stroke="#e5e7eb" stroke-width="2"/>
<text x="24" y="334" font-size="15" font-weight="bold" text-anchor="start" fill="#111827">Receiver puts them back together:</text>
<text x="384" y="372" font-size="17" font-weight="bold" text-anchor="middle" fill="#111827" font-family="Menlo, Consolas, monospace">(hi &lt;&lt; 8) | lo  =  0x0300 | 0xE8  =  0x03E8  =  1000</text>
<text x="384" y="400" font-size="13" text-anchor="middle" fill="#6b7280">Shift the high byte 8 places left, then OR in the low byte</text>
