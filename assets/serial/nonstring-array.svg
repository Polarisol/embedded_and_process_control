<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 768 360" width="768" height="360" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker></defs>
<rect width="768" height="360" rx="10" fill="#ffffff"/>
<text x="384.0" y="28" font-size="17" font-weight="bold" text-anchor="middle" fill="#111827">An array of single-byte values</text>
<text x="24" y="68" font-size="15" font-weight="bold" text-anchor="start" fill="#111827" font-family="Menlo, Consolas, monospace">uint8_t rgb[3] = {255, 128, 0};</text>
<rect x="24" y="86" width="68" height="60" rx="6" fill="#fde2e1" stroke="#b42318" stroke-width="2"/>
<text x="58.0" y="118.0" font-size="22" font-weight="bold" text-anchor="middle" fill="#111827" font-family="Menlo, Consolas, monospace">FF</text>
<text x="58.0" y="138.0" font-size="12" text-anchor="middle" fill="#b42318">255</text>
<text x="58" y="166" font-size="12" text-anchor="middle" fill="#6b7280" font-family="Menlo, Consolas, monospace">rgb[0]</text>
<rect x="100" y="86" width="68" height="60" rx="6" fill="#dff3e4" stroke="#15803d" stroke-width="2"/>
<text x="134.0" y="118.0" font-size="22" font-weight="bold" text-anchor="middle" fill="#111827" font-family="Menlo, Consolas, monospace">80</text>
<text x="134.0" y="138.0" font-size="12" text-anchor="middle" fill="#15803d">128</text>
<text x="134" y="166" font-size="12" text-anchor="middle" fill="#6b7280" font-family="Menlo, Consolas, monospace">rgb[1]</text>
<rect x="176" y="86" width="68" height="60" rx="6" fill="#e0ecfb" stroke="#1d4ed8" stroke-width="2"/>
<text x="210.0" y="118.0" font-size="22" font-weight="bold" text-anchor="middle" fill="#111827" font-family="Menlo, Consolas, monospace">00</text>
<text x="210.0" y="138.0" font-size="12" text-anchor="middle" fill="#1d4ed8">0</text>
<text x="210" y="166" font-size="12" text-anchor="middle" fill="#6b7280" font-family="Menlo, Consolas, monospace">rgb[2]</text>
<line x1="258" y1="116" x2="470" y2="116" stroke="#111827" stroke-width="2.5" marker-end="url(#ah)"/>
<text x="364" y="106" font-size="13" text-anchor="middle" fill="#374151" font-family="Menlo, Consolas, monospace">Serial.write(rgb, 3)</text>
<text x="364" y="136" font-size="12" text-anchor="middle" fill="#6b7280">serial line</text>
<rect x="480" y="86" width="68" height="60" rx="6" fill="#fde2e1" stroke="#b42318" stroke-width="2"/>
<text x="514.0" y="118.0" font-size="22" font-weight="bold" text-anchor="middle" fill="#111827" font-family="Menlo, Consolas, monospace">FF</text>
<text x="514.0" y="138.0" font-size="12" text-anchor="middle" fill="#b42318">255</text>
<text x="514" y="166" font-size="12" text-anchor="middle" fill="#6b7280" font-family="Menlo, Consolas, monospace">r = 255</text>
<rect x="556" y="86" width="68" height="60" rx="6" fill="#dff3e4" stroke="#15803d" stroke-width="2"/>
<text x="590.0" y="118.0" font-size="22" font-weight="bold" text-anchor="middle" fill="#111827" font-family="Menlo, Consolas, monospace">80</text>
<text x="590.0" y="138.0" font-size="12" text-anchor="middle" fill="#15803d">128</text>
<text x="590" y="166" font-size="12" text-anchor="middle" fill="#6b7280" font-family="Menlo, Consolas, monospace">g = 128</text>
<rect x="632" y="86" width="68" height="60" rx="6" fill="#e0ecfb" stroke="#1d4ed8" stroke-width="2"/>
<text x="666.0" y="118.0" font-size="22" font-weight="bold" text-anchor="middle" fill="#111827" font-family="Menlo, Consolas, monospace">00</text>
<text x="666.0" y="138.0" font-size="12" text-anchor="middle" fill="#1d4ed8">0</text>
<text x="666" y="166" font-size="12" text-anchor="middle" fill="#6b7280" font-family="Menlo, Consolas, monospace">b = 0</text>
<line x1="24" y1="196" x2="744" y2="196" stroke="#e5e7eb" stroke-width="2"/>
<text x="24" y="228" font-size="14" font-weight="bold" text-anchor="start" fill="#111827">Send:</text>
<text x="100" y="228" font-size="14" text-anchor="start" fill="#374151" font-family="Menlo, Consolas, monospace">Serial.write(rgb, 3);</text>
<text x="24" y="256" font-size="14" font-weight="bold" text-anchor="start" fill="#111827">Receive:</text>
<text x="100" y="256" font-size="14" text-anchor="start" fill="#374151" font-family="Menlo, Consolas, monospace">r, g, b = self.port.read(3).data()</text>
<text x="24" y="300" font-size="14" text-anchor="start" fill="#111827">Every byte is a value of its own, from 0 to 255.</text>
<text x="24" y="324" font-size="14" text-anchor="start" fill="#111827">Nothing to split or join: byte 1 is red, byte 2 is green, byte 3 is blue.</text>
</svg>
