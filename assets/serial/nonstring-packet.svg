<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 768 330" width="768" height="330" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker></defs>
<rect width="768" height="330" rx="10" fill="#ffffff"/>
<text x="384.0" y="28" font-size="17" font-weight="bold" text-anchor="middle" fill="#111827">A packet: where a message starts, how long it is, and did it arrive intact</text>
<rect x="38.0" y="58" width="92" height="70" rx="6" fill="#fde2e1" stroke="#b42318" stroke-width="2"/>
<text x="84.0" y="95.0" font-size="22" font-weight="bold" text-anchor="middle" fill="#111827" font-family="Menlo, Consolas, monospace">0xAA</text>
<text x="84.0" y="115.0" font-size="12" text-anchor="middle" fill="#b42318">start</text>
<rect x="138.0" y="58" width="92" height="70" rx="6" fill="#fff1cc" stroke="#a16207" stroke-width="2"/>
<text x="184.0" y="95.0" font-size="22" font-weight="bold" text-anchor="middle" fill="#111827" font-family="Menlo, Consolas, monospace">0x04</text>
<text x="184.0" y="115.0" font-size="12" text-anchor="middle" fill="#a16207">length</text>
<rect x="238.0" y="58" width="92" height="70" rx="6" fill="#e0ecfb" stroke="#1d4ed8" stroke-width="2"/>
<text x="284.0" y="95.0" font-size="22" font-weight="bold" text-anchor="middle" fill="#111827" font-family="Menlo, Consolas, monospace">0xEB</text>
<text x="284.0" y="115.0" font-size="12" text-anchor="middle" fill="#1d4ed8">temp lo</text>
<rect x="338.0" y="58" width="92" height="70" rx="6" fill="#e0ecfb" stroke="#1d4ed8" stroke-width="2"/>
<text x="384.0" y="95.0" font-size="22" font-weight="bold" text-anchor="middle" fill="#111827" font-family="Menlo, Consolas, monospace">0x00</text>
<text x="384.0" y="115.0" font-size="12" text-anchor="middle" fill="#1d4ed8">temp hi</text>
<rect x="438.0" y="58" width="92" height="70" rx="6" fill="#dff3e4" stroke="#15803d" stroke-width="2"/>
<text x="484.0" y="95.0" font-size="22" font-weight="bold" text-anchor="middle" fill="#111827" font-family="Menlo, Consolas, monospace">0x58</text>
<text x="484.0" y="115.0" font-size="12" text-anchor="middle" fill="#15803d">light lo</text>
<rect x="538.0" y="58" width="92" height="70" rx="6" fill="#dff3e4" stroke="#15803d" stroke-width="2"/>
<text x="584.0" y="95.0" font-size="22" font-weight="bold" text-anchor="middle" fill="#111827" font-family="Menlo, Consolas, monospace">0x02</text>
<text x="584.0" y="115.0" font-size="12" text-anchor="middle" fill="#15803d">light hi</text>
<rect x="638.0" y="58" width="92" height="70" rx="6" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/>
<text x="684.0" y="95.0" font-size="22" font-weight="bold" text-anchor="middle" fill="#111827" font-family="Menlo, Consolas, monospace">0xB1</text>
<text x="684.0" y="115.0" font-size="12" text-anchor="middle" fill="#6b7280">checksum</text>
<path d="M238.0 138 L238.0 148 L430.0 148 L430.0 138" fill="none" stroke="#1d4ed8" stroke-width="2"/>
<text x="334.0" y="170" font-size="13" font-weight="bold" text-anchor="middle" fill="#1d4ed8">temp = 0x00EB = 235 → 23.5 °C</text>
<path d="M438.0 138 L438.0 148 L630.0 148 L630.0 138" fill="none" stroke="#15803d" stroke-width="2"/>
<text x="534.0" y="170" font-size="13" font-weight="bold" text-anchor="middle" fill="#15803d">light = 0x0258 = 600</text>
<path d="M238.0 186 L238.0 196 L630.0 196 L630.0 186" fill="none" stroke="#374151" stroke-width="2"/>
<text x="434.0" y="218" font-size="13" font-weight="bold" text-anchor="middle" fill="#374151">data: 4 bytes</text>
<text x="60" y="254" font-size="14" font-weight="bold" text-anchor="start" fill="#b42318">Start byte</text>
<text x="170" y="254" font-size="14" text-anchor="start" fill="#374151">a fixed value that marks the beginning, so the receiver can find it</text>
<text x="60" y="278" font-size="14" font-weight="bold" text-anchor="start" fill="#a16207">Length</text>
<text x="170" y="278" font-size="14" text-anchor="start" fill="#374151">how many data bytes follow</text>
<text x="60" y="302" font-size="14" font-weight="bold" text-anchor="start" fill="#374151">Checksum</text>
<text x="170" y="302" font-size="14" text-anchor="start" fill="#374151">0xEB ^ 0x00 ^ 0x58 ^ 0x02 = 0xB1, XOR of the data bytes</text>
</svg>
