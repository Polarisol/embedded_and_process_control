<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 768 330" width="768" height="330" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker></defs>
<rect width="768" height="330" rx="10" fill="#ffffff"/>
<text x="384.0" y="28" font-size="17" font-weight="bold" text-anchor="middle" fill="#111827">Waiting for a line: the LED keeps blinking or it doesn't</text>
<text x="24" y="84" font-size="14" font-weight="bold" text-anchor="start" fill="#111827" font-family="Menlo, Consolas, monospace">readStringUntil('\n')</text>
<text x="24" y="104" font-size="12" text-anchor="start" fill="#6b7280">waits for the line</text>
<rect x="290.0" y="64" width="90.0" height="40" rx="4" fill="#dff3e4" stroke="#15803d" stroke-width="2"/>
<text x="335.0" y="89" font-size="12" font-weight="bold" text-anchor="middle" fill="#15803d">blink</text>
<rect x="380.0" y="64" width="315.0" height="40" rx="4" fill="#fde2e1" stroke="#b42318" stroke-width="2"/>
<text x="537.5" y="89" font-size="12" font-weight="bold" text-anchor="middle" fill="#b42318">waiting… LED frozen</text>
<rect x="695.0" y="64" width="45.0" height="40" rx="4" fill="#dff3e4" stroke="#15803d" stroke-width="2"/>
<text x="717.5" y="89" font-size="12" font-weight="bold" text-anchor="middle" fill="#15803d"></text>
<text x="24" y="180" font-size="14" font-weight="bold" text-anchor="start" fill="#111827" font-family="Menlo, Consolas, monospace">read() one char at a time</text>
<text x="24" y="200" font-size="12" text-anchor="start" fill="#6b7280">never waits</text>
<rect x="290.0" y="160" width="450.0" height="40" rx="4" fill="#dff3e4" stroke="#15803d" stroke-width="2"/>
<text x="515.0" y="185" font-size="12" font-weight="bold" text-anchor="middle" fill="#15803d">blink, blink, blink… line done ✓</text>
<path d="M290,236 L744,236" fill="none" stroke="#6b7280" stroke-width="2" marker-end="url(#ah)"/>
<text x="744" y="256" font-size="12" text-anchor="end" fill="#6b7280">time</text>
<line x1="380.0" y1="56" x2="380.0" y2="236" stroke="#1d4ed8" stroke-width="2" stroke-dasharray="4 4"/>
<text x="380.0" y="52" font-size="11" font-weight="bold" text-anchor="middle" fill="#1d4ed8">first byte</text>
<line x1="695.0" y1="56" x2="695.0" y2="236" stroke="#1d4ed8" stroke-width="2" stroke-dasharray="4 4"/>
<text x="695.0" y="52" font-size="11" font-weight="bold" text-anchor="middle" fill="#1d4ed8">'\n' arrives</text>
<text x="24" y="292" font-size="13" text-anchor="start" fill="#111827">A slow sender (a person typing, a slow module) can keep readStringUntil() waiting up to its</text>
<text x="24" y="312" font-size="13" text-anchor="start" fill="#111827">timeout, 1 second by default. Reading character by character lets loop() keep running.</text>
</svg>
