<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 768 330" width="768" height="330" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker></defs>
<rect width="768" height="330" rx="10" fill="#ffffff"/>
<text x="384.0" y="28" font-size="17" font-weight="bold" text-anchor="middle" fill="#111827">Bytes wait in the receive buffer until you read them</text>
<text x="24" y="70" font-size="14" text-anchor="start" fill="#111827">The PC sends "LED ON\n". Four bytes have arrived so far:</text>
<text x="588" y="121" font-size="13" font-weight="bold" text-anchor="start" fill="#6b7280">← from the wire</text>
<text x="140" y="121" font-size="12" font-weight="bold" text-anchor="end" fill="#1d4ed8">oldest</text>
<rect x="150" y="92" width="54" height="46" rx="6" fill="#e0ecfb" stroke="#1d4ed8" stroke-width="2"/>
<text x="177" y="122" font-size="18" font-weight="bold" text-anchor="middle" fill="#111827" font-family="Menlo, Consolas, monospace">L</text>
<rect x="212" y="92" width="54" height="46" rx="6" fill="#e0ecfb" stroke="#1d4ed8" stroke-width="2"/>
<text x="239" y="122" font-size="18" font-weight="bold" text-anchor="middle" fill="#111827" font-family="Menlo, Consolas, monospace">E</text>
<rect x="274" y="92" width="54" height="46" rx="6" fill="#e0ecfb" stroke="#1d4ed8" stroke-width="2"/>
<text x="301" y="122" font-size="18" font-weight="bold" text-anchor="middle" fill="#111827" font-family="Menlo, Consolas, monospace">D</text>
<rect x="336" y="92" width="54" height="46" rx="6" fill="#e0ecfb" stroke="#1d4ed8" stroke-width="2"/>
<text x="363" y="122" font-size="18" font-weight="bold" text-anchor="middle" fill="#111827" font-family="Menlo, Consolas, monospace">' '</text>
<rect x="398" y="92" width="54" height="46" rx="6" fill="#f3f4f6" stroke="#6b7280" stroke-width="2" stroke-dasharray="6 4"/>
<text x="425" y="122" font-size="18" font-weight="bold" text-anchor="middle" fill="#6b7280" font-family="Menlo, Consolas, monospace">O</text>
<rect x="460" y="92" width="54" height="46" rx="6" fill="#f3f4f6" stroke="#6b7280" stroke-width="2" stroke-dasharray="6 4"/>
<text x="487" y="122" font-size="18" font-weight="bold" text-anchor="middle" fill="#6b7280" font-family="Menlo, Consolas, monospace">N</text>
<rect x="522" y="92" width="54" height="46" rx="6" fill="#f3f4f6" stroke="#6b7280" stroke-width="2" stroke-dasharray="6 4"/>
<text x="549" y="122" font-size="18" font-weight="bold" text-anchor="middle" fill="#6b7280" font-family="Menlo, Consolas, monospace">\n</text>
<text x="301" y="160" font-size="12" font-weight="bold" text-anchor="middle" fill="#1d4ed8">in the buffer</text>
<text x="460" y="160" font-size="12" font-weight="bold" text-anchor="middle" fill="#6b7280">still on the way</text>
<line x1="24" y1="186" x2="744" y2="186" stroke="#e5e7eb" stroke-width="2"/>
<text x="24" y="218" font-size="15" font-weight="bold" text-anchor="start" fill="#111827" font-family="Menlo, Consolas, monospace">Serial.available()</text>
<text x="250" y="218" font-size="15" font-weight="bold" text-anchor="start" fill="#1d4ed8" font-family="Menlo, Consolas, monospace">→  4</text>
<text x="330" y="218" font-size="13" text-anchor="start" fill="#6b7280">how many bytes are waiting (it does not remove any)</text>
<text x="24" y="250" font-size="15" font-weight="bold" text-anchor="start" fill="#111827" font-family="Menlo, Consolas, monospace">Serial.read()</text>
<text x="250" y="250" font-size="15" font-weight="bold" text-anchor="start" fill="#1d4ed8" font-family="Menlo, Consolas, monospace">→  'L' (76)</text>
<text x="400" y="250" font-size="13" text-anchor="start" fill="#6b7280">takes the oldest byte out of the buffer</text>
<text x="24" y="282" font-size="15" font-weight="bold" text-anchor="start" fill="#111827" font-family="Menlo, Consolas, monospace">Serial.read()</text>
<text x="250" y="282" font-size="15" font-weight="bold" text-anchor="start" fill="#b42318" font-family="Menlo, Consolas, monospace">→  -1</text>
<text x="400" y="282" font-size="13" text-anchor="start" fill="#6b7280">…when the buffer is empty</text>
<text x="24" y="314" font-size="13" font-weight="bold" text-anchor="start" fill="#a16207">If you never read, the buffer fills up and new bytes are lost.</text>
</svg>
