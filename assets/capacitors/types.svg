<text x="120" y="274" font-size="13" font-weight="bold" text-anchor="middle" fill="#111827">104 = 100 nF</text>
<text x="120" y="292" font-size="12" text-anchor="middle" fill="#15803d">no polarity</text>
<text x="330" y="62" font-size="15" font-weight="bold" text-anchor="middle" fill="#1d4ed8">Electrolytic</text>
