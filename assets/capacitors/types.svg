<text x="358" y="164" font-size="18" font-weight="bold" text-anchor="middle" fill="#1e3a8a">−</text>
<text x="358" y="192" font-size="18" font-weight="bold" text-anchor="middle" fill="#1e3a8a">−</text>
<text x="318" y="140" font-size="12" font-weight="bold" text-anchor="middle" fill="#ffffff">100µF</text>
<text x="318" y="156" font-size="12" font-weight="bold" text-anchor="middle" fill="#ffffff">25V</text>
