<text x="70" y="168" font-size="12" text-anchor="end" fill="#374151">battery</text>
<rect x="520" y="80" width="220" height="190" rx="8" fill="#e0ecfb" stroke="none" stroke-width="2"/>
<text x="630" y="106" font-size="14" font-weight="bold" text-anchor="middle" fill="#1d4ed8">What happens</text>
<text x="536" y="132" font-size="12" text-anchor="start" fill="#374151">Electrons are pushed onto</text>
<text x="536" y="150" font-size="12" text-anchor="start" fill="#374151">one plate and pulled off the</text>
<text x="536" y="168" font-size="12" text-anchor="start" fill="#374151">other. No current crosses</text>
<text x="536" y="186" font-size="12" text-anchor="start" fill="#374151">the insulator.</text>
<text x="536" y="204" font-size="12" text-anchor="start" fill="#374151"></text>
<text x="536" y="222" font-size="12" text-anchor="start" fill="#374151">Take the battery away:</text>
<text x="536" y="240" font-size="12" text-anchor="start" fill="#374151">the charge stays on the</text>
<text x="536" y="258" font-size="12" text-anchor="start" fill="#374151">plates, ready to use.</text>
