<text x="348" y="194" font-size="18" font-weight="bold" text-anchor="middle" fill="#1d4ed8">−</text>
<text x="238" y="222" font-size="18" font-weight="bold" text-anchor="middle" fill="#b42318">+</text>
<text x="348" y="222" font-size="18" font-weight="bold" text-anchor="middle" fill="#1d4ed8">−</text>
