<rect width="768" height="350" rx="10" fill="#ffffff"/>
<text x="384.0" y="28" font-size="17" font-weight="bold" text-anchor="middle" fill="#111827">Inside a capacitor: two plates and an insulator</text>
<rect x="250" y="80" width="22" height="180" rx="2" fill="#9ca3af" stroke="#111827" stroke-width="2"/>
<rect x="272" y="80" width="40" height="180" rx="0" fill="#fde68a" stroke="#d97706" stroke-width="1.5"/>
