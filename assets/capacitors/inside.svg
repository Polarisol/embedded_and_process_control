<text x="226" y="280" font-size="12" text-anchor="end" fill="#374151">plate</text>
<text x="358" y="280" font-size="12" text-anchor="start" fill="#374151">plate</text>
<text x="292" y="284" font-size="12" font-weight="bold" text-anchor="middle" fill="#92400e">insulator</text>
<text x="292" y="300" font-size="12" text-anchor="middle" fill="#92400e">(dielectric)</text>
<text x="238" y="110" font-size="18" font-weight="bold" text-anchor="middle" fill="#b42318">+</text>
<text x="348" y="110" font-size="18" font-weight="bold" text-anchor="middle" fill="#1d4ed8">−</text>
