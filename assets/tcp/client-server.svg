<text x="618" y="188" font-size="13" font-weight="bold" text-anchor="middle" fill="#111827">Web server</text>
<text x="618" y="206" font-size="12" font-family="Menlo, Consolas, monospace" xml:space="preserve" text-anchor="middle" fill="#374151">142.250.75.14</text>
<line x1="290" y1="132" x2="560" y2="132" stroke="#15803d" stroke-width="2.5" marker-end="url(#ag)"/>
<text x="425" y="122" font-size="12" font-weight="bold" text-anchor="middle" fill="#15803d">1. request: "send me the page"</text>
<line x1="560" y1="172" x2="290" y2="172" stroke="#1d4ed8" stroke-width="2.5" marker-end="url(#ab)"/>
<text x="425" y="192" font-size="12" font-weight="bold" text-anchor="middle" fill="#1d4ed8">2. response: the page</text>
<rect x="40" y="236" width="688" height="90" rx="8" fill="#f6f7f9" stroke="#d1d5db" stroke-width="1.5"/>
<text x="384" y="264" font-size="13" text-anchor="middle" fill="#374151">The server opens a port and waits. It never knows who will come.</text>
<text x="384" y="286" font-size="13" text-anchor="middle" fill="#374151">The client knows the server's address and port, and it is always the one that connects.</text>
<text x="384" y="308" font-size="13" text-anchor="middle" fill="#374151">One server can talk with thousands of clients at the same time.</text>
</svg>
