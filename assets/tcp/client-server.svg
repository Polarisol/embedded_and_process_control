<text x="70" y="184" font-size="13" font-weight="bold" text-anchor="middle" fill="#111827">Browser</text>
<rect x="134" y="104" width="32" height="56" rx="5" fill="#cbd5e1" stroke="#475569" stroke-width="2"/>
<rect x="139" y="110" width="22" height="40" rx="2" fill="#e0ecfb"/>
<text x="150" y="182" font-size="13" font-weight="bold" text-anchor="middle" fill="#111827">Phone app</text>
