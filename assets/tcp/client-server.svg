<text x="618" y="78" font-size="12" text-anchor="middle" fill="#374151">always on, waiting (listening)</text>
<rect x="588" y="106" width="60" height="18" rx="3" fill="#cbd5e1" stroke="#475569" stroke-width="2"/>
<circle cx="636" cy="115" r="3" fill="#15803d"/>
