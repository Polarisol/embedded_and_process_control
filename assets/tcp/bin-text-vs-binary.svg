<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 768 330" width="768" height="330" font-family="Helvetica, Arial, sans-serif">
<rect width="768" height="330" rx="10" fill="#ffffff"/>
<text x="384.0" y="28" font-size="17" font-weight="bold" text-anchor="middle" fill="#111827">The number 1500: as text, and as bytes</text>
<text x="40" y="72" font-size="15" font-weight="bold" text-anchor="start" fill="#b42318" xml:space="preserve">As text: "1500\n"</text>
<rect x="40" y="84" width="60" height="46" rx="5" fill="#fde8e7" stroke="#b42318" stroke-width="2"/>
<text x="70.0" y="113.3" font-size="18" font-weight="bold" font-family="Menlo, Consolas, monospace" text-anchor="middle" fill="#111827">31</text>
<text x="70" y="148" font-size="13" font-family="Menlo, Consolas, monospace" text-anchor="middle" fill="#374151" xml:space="preserve">'1'</text>
<rect x="112" y="84" width="60" height="46" rx="5" fill="#fde8e7" stroke="#b42318" stroke-width="2"/>
<text x="142.0" y="113.3" font-size="18" font-weight="bold" font-family="Menlo, Consolas, monospace" text-anchor="middle" fill="#111827">35</text>
<text x="142" y="148" font-size="13" font-family="Menlo, Consolas, monospace" text-anchor="middle" fill="#374151" xml:space="preserve">'5'</text>
<rect x="184" y="84" width="60" height="46" rx="5" fill="#fde8e7" stroke="#b42318" stroke-width="2"/>
<text x="214.0" y="113.3" font-size="18" font-weight="bold" font-family="Menlo, Consolas, monospace" text-anchor="middle" fill="#111827">30</text>
<text x="214" y="148" font-size="13" font-family="Menlo, Consolas, monospace" text-anchor="middle" fill="#374151" xml:space="preserve">'0'</text>
<rect x="256" y="84" width="60" height="46" rx="5" fill="#fde8e7" stroke="#b42318" stroke-width="2"/>
<text x="286.0" y="113.3" font-size="18" font-weight="bold" font-family="Menlo, Consolas, monospace" text-anchor="middle" fill="#111827">30</text>
<text x="286" y="148" font-size="13" font-family="Menlo, Consolas, monospace" text-anchor="middle" fill="#374151" xml:space="preserve">'0'</text>
<rect x="328" y="84" width="60" height="46" rx="5" fill="#fde8e7" stroke="#b42318" stroke-width="2"/>
<text x="358.0" y="113.3" font-size="18" font-weight="bold" font-family="Menlo, Consolas, monospace" text-anchor="middle" fill="#111827">0A</text>
<text x="358" y="148" font-size="13" font-family="Menlo, Consolas, monospace" text-anchor="middle" fill="#374151" xml:space="preserve">'\n'</text>
<text x="420" y="104" font-size="15" font-weight="bold" text-anchor="start" fill="#b42318" xml:space="preserve">5 bytes</text>
<text x="420" y="126" font-size="13" text-anchor="start" fill="#374151" xml:space="preserve">the receiver must find the '\n',</text>
<text x="420" y="144" font-size="13" text-anchor="start" fill="#374151" xml:space="preserve">then turn the characters into a number</text>
<text x="40" y="196" font-size="15" font-weight="bold" text-anchor="start" fill="#15803d" xml:space="preserve">As bytes: 1500</text>
<rect x="40" y="208" width="60" height="46" rx="5" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
<text x="70.0" y="237.3" font-size="18" font-weight="bold" font-family="Menlo, Consolas, monospace" text-anchor="middle" fill="#111827">05</text>
<text x="70" y="272" font-size="11" font-family="Menlo, Consolas, monospace" text-anchor="middle" fill="#374151" xml:space="preserve">00000101</text>
<rect x="112" y="208" width="60" height="46" rx="5" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
<text x="142.0" y="237.3" font-size="18" font-weight="bold" font-family="Menlo, Consolas, monospace" text-anchor="middle" fill="#111827">DC</text>
<text x="142" y="272" font-size="11" font-family="Menlo, Consolas, monospace" text-anchor="middle" fill="#374151" xml:space="preserve">11011100</text>
<text x="420" y="228" font-size="15" font-weight="bold" text-anchor="start" fill="#15803d" xml:space="preserve">2 bytes</text>
<text x="420" y="250" font-size="13" text-anchor="start" fill="#374151" xml:space="preserve">the receiver uses them as they are</text>
<text x="420" y="268" font-size="13" font-family="Menlo, Consolas, monospace" text-anchor="start" fill="#374151" xml:space="preserve">05 × 256 + DC (220) = 1500</text>
<line x1="40" y1="292" x2="728" y2="292" stroke="#d1d5db" stroke-width="1.5"/>
<text x="384.0" y="316" font-size="13" text-anchor="middle" fill="#374151" xml:space="preserve">Same number, less than half the bytes, and no parsing.</text>
</svg>
