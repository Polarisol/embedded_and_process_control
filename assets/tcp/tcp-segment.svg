<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 768 330" width="768" height="330" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#15803d"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b42318"/></marker><marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/></marker><marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#a16207"/></marker><marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker></defs>
<rect width="768" height="330" rx="10" fill="#ffffff"/>
<text x="384.0" y="28" font-size="17" font-weight="bold" text-anchor="middle" fill="#111827">A TCP segment travels inside an IP packet</text>
<rect x="20" y="50" width="728" height="170" rx="10" fill="#fef3c7" stroke="#a16207" stroke-width="2"/>
<text x="36" y="72" font-size="13" font-weight="bold" text-anchor="start" fill="#a16207">IP packet</text>
<rect x="36" y="84" width="150" height="120" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
<text x="111" y="106" font-size="13" font-weight="bold" text-anchor="middle" fill="#15803d">IP header</text>
<text x="111" y="136" font-size="12" text-anchor="middle" fill="#374151">From: device</text>
<text x="111" y="156" font-size="12" text-anchor="middle" fill="#374151">To: device</text>
<text x="111" y="186" font-size="11" text-anchor="middle" fill="#6b7280">which computer?</text>
<rect x="198" y="80" width="536" height="128" rx="8" fill="#ffffff" stroke="#1d4ed8" stroke-width="2"/>
<text x="210" y="98" font-size="13" font-weight="bold" text-anchor="start" fill="#1d4ed8">TCP segment</text>
<rect x="210" y="108" width="52" height="62" rx="4" fill="#e0ecfb" stroke="#1d4ed8" stroke-width="1"/>
<text x="236.0" y="126" font-size="10" font-weight="bold" text-anchor="middle" fill="#1d4ed8">From port</text>
<text x="236.0" y="146" font-size="10" font-family="Menlo, Consolas, monospace" xml:space="preserve" text-anchor="middle" fill="#111827">54321</text>
<rect x="266" y="108" width="46" height="62" rx="4" fill="#e0ecfb" stroke="#1d4ed8" stroke-width="1"/>
<text x="289.0" y="126" font-size="10" font-weight="bold" text-anchor="middle" fill="#1d4ed8">To port</text>
<text x="289.0" y="146" font-size="10" font-family="Menlo, Consolas, monospace" xml:space="preserve" text-anchor="middle" fill="#111827">443</text>
<rect x="316" y="108" width="42" height="62" rx="4" fill="#e0ecfb" stroke="#1d4ed8" stroke-width="1"/>
<text x="337.0" y="126" font-size="10" font-weight="bold" text-anchor="middle" fill="#1d4ed8">Seq</text>
<text x="337.0" y="146" font-size="10" font-family="Menlo, Consolas, monospace" xml:space="preserve" text-anchor="middle" fill="#111827">1001</text>
<rect x="362" y="108" width="40" height="62" rx="4" fill="#e0ecfb" stroke="#1d4ed8" stroke-width="1"/>
<text x="382.0" y="126" font-size="10" font-weight="bold" text-anchor="middle" fill="#1d4ed8">Ack</text>
<text x="382.0" y="146" font-size="10" font-family="Menlo, Consolas, monospace" xml:space="preserve" text-anchor="middle" fill="#111827">501</text>
<rect x="406" y="108" width="72" height="62" rx="4" fill="#e0ecfb" stroke="#1d4ed8" stroke-width="1"/>
<text x="442.0" y="126" font-size="10" font-weight="bold" text-anchor="middle" fill="#1d4ed8">Flags</text>
<text x="442.0" y="146" font-size="10" font-family="Menlo, Consolas, monospace" xml:space="preserve" text-anchor="middle" fill="#111827">ACK</text>
<rect x="482" y="108" width="52" height="62" rx="4" fill="#e0ecfb" stroke="#1d4ed8" stroke-width="1"/>
<text x="508.0" y="126" font-size="10" font-weight="bold" text-anchor="middle" fill="#1d4ed8">Window</text>
<text x="508.0" y="146" font-size="10" font-family="Menlo, Consolas, monospace" xml:space="preserve" text-anchor="middle" fill="#111827">4096</text>
<rect x="538" y="108" width="60" height="62" rx="4" fill="#e0ecfb" stroke="#1d4ed8" stroke-width="1"/>
<text x="568.0" y="126" font-size="10" font-weight="bold" text-anchor="middle" fill="#1d4ed8">Checksum</text>
<text x="568.0" y="146" font-size="10" font-family="Menlo, Consolas, monospace" xml:space="preserve" text-anchor="middle" fill="#111827">a3f0</text>
<text x="404.0" y="192" font-size="11" text-anchor="middle" fill="#6b7280">TCP header: the bookkeeping that IP does not do</text>
<rect x="608" y="108" width="116" height="62" rx="6" fill="#ffffff" stroke="#a16207" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="666" y="135" font-size="13" font-weight="bold" text-anchor="middle" fill="#111827">Data</text>
<text x="666" y="153" font-size="11" text-anchor="middle" fill="#374151">a piece of</text>
<text x="666" y="166" font-size="11" text-anchor="middle" fill="#374151">your message</text>
<text x="384" y="252" font-size="13" text-anchor="middle" fill="#374151">Like an envelope inside an envelope: the outer one (IP) gets it to the right device,</text>
<text x="384" y="272" font-size="13" text-anchor="middle" fill="#374151">the inner one (TCP) gets it to the right program, in the right order, and checks it.</text>
<text x="384" y="304" font-size="12" text-anchor="middle" fill="#6b7280">In real numbers: the IP header is 20 bytes, the TCP header is 20 bytes, and the data is up to about 1,460 bytes.</text>
</svg>
