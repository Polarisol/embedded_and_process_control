<line x1="24" y1="140" x2="744" y2="140" stroke="#e5e7eb" stroke-width="2"/>
<text x="24" y="182" font-size="16" font-weight="bold" text-anchor="start" fill="#111827" font-family="Menlo, Consolas, monospace">client.write(200);</text>
<text x="24" y="204" font-size="13" text-anchor="start" fill="#6b7280">sends one byte whose value is 200</text>
