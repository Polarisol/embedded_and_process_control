<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 768 470" width="768" height="470" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#15803d"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b42318"/></marker><marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/></marker><marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#a16207"/></marker><marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker></defs>
<rect width="768" height="470" rx="10" fill="#ffffff"/>
<text x="384.0" y="28" font-size="17" font-weight="bold" text-anchor="middle" fill="#111827">Sequence numbers, ACKs and resending a lost segment</text>
<text x="150" y="62" font-size="14" font-weight="bold" text-anchor="middle" fill="#1d4ed8">Sender</text>
<text x="618" y="62" font-size="14" font-weight="bold" text-anchor="middle" fill="#b42318">Receiver</text>
<line x1="150" y1="72" x2="150" y2="420" stroke="#9ca3af" stroke-width="2" stroke-dasharray="6 5"/>
<line x1="618" y1="72" x2="618" y2="420" stroke="#9ca3af" stroke-width="2" stroke-dasharray="6 5"/>
<line x1="150" y1="96" x2="618" y2="126" stroke="#15803d" stroke-width="2.5" marker-end="url(#ag)"/>
<rect x="303.2" y="85.0" width="161.6" height="22" rx="4" fill="#ffffff"/>
<text x="384.0" y="101.0" font-size="13" font-weight="bold" font-family="Menlo, Consolas, monospace" xml:space="preserve" text-anchor="middle" fill="#15803d">Seq 1: bytes 1-100</text>
<line x1="618" y1="140" x2="150" y2="170" stroke="#1d4ed8" stroke-width="2.5" marker-end="url(#ab)"/>
<rect x="348.3" y="129.0" width="71.39999999999999" height="22" rx="4" fill="#ffffff"/>
<text x="384.0" y="145.0" font-size="13" font-weight="bold" font-family="Menlo, Consolas, monospace" xml:space="preserve" text-anchor="middle" fill="#1d4ed8">ACK 101</text>
<text x="384" y="182" font-size="12" text-anchor="middle" fill="#374151">"I have everything up to 100. Send 101 next."</text>
<line x1="150" y1="206" x2="440.16" y2="224.6" stroke="#15803d" stroke-width="2.5"/>
<line x1="432.16" y1="216.6" x2="448.16" y2="232.6" stroke="#b42318" stroke-width="3.5"/>
<line x1="432.16" y1="232.6" x2="448.16" y2="216.6" stroke="#b42318" stroke-width="3.5"/>
<text x="456.16" y="229.6" font-size="13" font-weight="bold" text-anchor="start" fill="#b42318">lost on the way</text>
<rect x="193.2" y="189.0" width="194.39999999999998" height="22" rx="4" fill="#ffffff"/>
<text x="290.4" y="205.0" font-size="13" font-weight="bold" font-family="Menlo, Consolas, monospace" xml:space="preserve" text-anchor="middle" fill="#15803d">Seq 101: bytes 101-200</text>
<rect x="40" y="250" width="98" height="82" rx="6" fill="#fef3c7" stroke="#a16207" stroke-width="1.5"/>
<text x="89" y="272" font-size="13" font-weight="bold" text-anchor="middle" fill="#a16207">⏱ timer</text>
<text x="89" y="292" font-size="11" text-anchor="middle" fill="#374151">no ACK 201</text>
<text x="89" y="306" font-size="11" text-anchor="middle" fill="#374151">came back in</text>
<text x="89" y="320" font-size="11" text-anchor="middle" fill="#374151">time...</text>
<line x1="150" y1="214" x2="150" y2="330" stroke="#a16207" stroke-width="5"/>
<line x1="150" y1="340" x2="618" y2="370" stroke="#15803d" stroke-width="2.5" marker-end="url(#ag)"/>
<rect x="286.8" y="329.0" width="194.39999999999998" height="22" rx="4" fill="#ffffff"/>
<text x="384.0" y="345.0" font-size="13" font-weight="bold" font-family="Menlo, Consolas, monospace" xml:space="preserve" text-anchor="middle" fill="#15803d">Seq 101: bytes 101-200</text>
<text x="160" y="336" font-size="12" font-weight="bold" text-anchor="start" fill="#a16207">...so send it again</text>
<line x1="618" y1="386" x2="150" y2="416" stroke="#1d4ed8" stroke-width="2.5" marker-end="url(#ab)"/>
<rect x="348.3" y="375.0" width="71.39999999999999" height="22" rx="4" fill="#ffffff"/>
<text x="384.0" y="391.0" font-size="13" font-weight="bold" font-family="Menlo, Consolas, monospace" xml:space="preserve" text-anchor="middle" fill="#1d4ed8">ACK 201</text>
<text x="384" y="452" font-size="12" text-anchor="middle" fill="#6b7280">Every byte has a number. The receiver says which byte it expects next, and the sender keeps a copy until it hears that.</text>
</svg>
