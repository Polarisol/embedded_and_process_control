<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 768 330" width="768" height="330" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#15803d"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b42318"/></marker><marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/></marker><marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#a16207"/></marker><marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker></defs>
<rect width="768" height="330" rx="10" fill="#ffffff"/>
<text x="384.0" y="28" font-size="17" font-weight="bold" text-anchor="middle" fill="#111827">The receiver puts the pieces back together</text>
<text x="160" y="62" font-size="13" font-weight="bold" text-anchor="middle" fill="#374151">What arrived, in this order</text>
<rect x="40" y="76" width="86" height="36" rx="5" fill="#e0ecfb" stroke="#1d4ed8" stroke-width="2"/>
<text x="83" y="99" font-size="13" font-weight="bold" font-family="Menlo, Consolas, monospace" xml:space="preserve" text-anchor="middle" fill="#111827">Seq 201</text>
<text x="136" y="99" font-size="12" text-anchor="start" fill="#374151">bytes 201-300</text>
<rect x="40" y="122" width="86" height="36" rx="5" fill="#e0ecfb" stroke="#1d4ed8" stroke-width="2"/>
<text x="83" y="145" font-size="13" font-weight="bold" font-family="Menlo, Consolas, monospace" xml:space="preserve" text-anchor="middle" fill="#111827">Seq 1</text>
<text x="136" y="145" font-size="12" text-anchor="start" fill="#374151">bytes 1-100</text>
<rect x="40" y="168" width="86" height="36" rx="5" fill="#fde2e1" stroke="#b42318" stroke-width="2"/>
<text x="83" y="191" font-size="13" font-weight="bold" font-family="Menlo, Consolas, monospace" xml:space="preserve" text-anchor="middle" fill="#111827">Seq 1</text>
<text x="136" y="191" font-size="12" text-anchor="start" fill="#374151">bytes 1-100</text>
<text x="236" y="191" font-size="12" font-weight="bold" text-anchor="start" fill="#b42318">copy: thrown away</text>
<rect x="40" y="214" width="86" height="36" rx="5" fill="#fef3c7" stroke="#a16207" stroke-width="2"/>
<text x="83" y="237" font-size="13" font-weight="bold" font-family="Menlo, Consolas, monospace" xml:space="preserve" text-anchor="middle" fill="#111827">Seq 101</text>
<text x="136" y="237" font-size="12" text-anchor="start" fill="#374151">bytes 101-200</text>
<text x="236" y="237" font-size="12" font-weight="bold" text-anchor="start" fill="#a16207">bad checksum: thrown away</text>
<rect x="40" y="260" width="86" height="36" rx="5" fill="#e0ecfb" stroke="#1d4ed8" stroke-width="2"/>
<text x="83" y="283" font-size="13" font-weight="bold" font-family="Menlo, Consolas, monospace" xml:space="preserve" text-anchor="middle" fill="#111827">Seq 101</text>
<text x="136" y="283" font-size="12" text-anchor="start" fill="#374151">bytes 101-200</text>
<text x="236" y="283" font-size="12" font-weight="bold" text-anchor="start" fill="#1d4ed8">sent again</text>
<line x1="440" y1="190" x2="500" y2="190" stroke="#15803d" stroke-width="3" marker-end="url(#ag)"/>
<text x="624" y="62" font-size="13" font-weight="bold" text-anchor="middle" fill="#374151">What the program reads</text>
<rect x="520" y="112" width="208" height="40" rx="5" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
<text x="624" y="137" font-size="13" font-weight="bold" text-anchor="middle" fill="#111827">Seq 1: bytes 1-100</text>
<rect x="520" y="160" width="208" height="40" rx="5" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
<text x="624" y="185" font-size="13" font-weight="bold" text-anchor="middle" fill="#111827">Seq 101: bytes 101-200</text>
<rect x="520" y="208" width="208" height="40" rx="5" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
<text x="624" y="233" font-size="13" font-weight="bold" text-anchor="middle" fill="#111827">Seq 201: bytes 201-300</text>
<text x="624" y="284" font-size="13" font-weight="bold" text-anchor="middle" fill="#15803d">in order, once each, unharmed</text>
<text x="384" y="316" font-size="13" text-anchor="middle" fill="#374151">The program never sees the mess. It just reads a clean stream of bytes.</text>
</svg>
