<text x="194" y="228" font-size="13" text-anchor="middle" fill="#b42318">Bytes that are not letters show up as</text>
<text x="194" y="248" font-size="13" text-anchor="middle" fill="#b42318">boxes, question marks or nothing at all</text>
<text x="574" y="228" font-size="13" text-anchor="middle" fill="#15803d">Every byte is exactly 2 hex digits,</text>
<text x="574" y="248" font-size="13" text-anchor="middle" fill="#15803d">so you can read each value</text>
<text x="384" y="284" font-size="13" text-anchor="middle" fill="#6b7280">Same 6 bytes on the network. Only the way the program prints them is different.</text>
