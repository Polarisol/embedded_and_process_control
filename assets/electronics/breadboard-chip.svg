<text x="414" y="80" font-size="15" font-weight="bold" text-anchor="start" fill="#111827">Why is there a gap?</text>
<text x="414" y="99" font-size="13" text-anchor="start" fill="#374151">Chips sit across the gap.</text>
<text x="414" y="118" font-size="13" text-anchor="start" fill="#374151">Each pin lands in its own</text>
<text x="414" y="137" font-size="13" text-anchor="start" fill="#374151">column, so no two pins are</text>
<text x="414" y="156" font-size="13" text-anchor="start" fill="#374151">connected to each other, and</text>
<text x="414" y="175" font-size="13" text-anchor="start" fill="#374151">the free holes (green) are</text>
<text x="414" y="194" font-size="13" text-anchor="start" fill="#374151">where you plug in wires.</text>
<text x="414" y="213" font-size="13" text-anchor="start" fill="#374151"></text>
<text x="414" y="232" font-size="13" font-weight="bold" text-anchor="start" fill="#1d4ed8">Your Nano ESP32 sits across</text>
<text x="414" y="251" font-size="13" font-weight="bold" text-anchor="start" fill="#1d4ed8">the gap in exactly the same way.</text>
</svg>
