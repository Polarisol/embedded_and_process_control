<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 768 370" width="768" height="370" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker></defs>
<rect width="768" height="370" rx="10" fill="#ffffff"/>
<text x="384" y="28" font-size="17" font-weight="bold" text-anchor="middle" fill="#111827">A traffic light as a state machine</text>
<!-- start arrow -->
<circle cx="40" cy="150" r="6" fill="#374151"/>
<path d="M46,150 L110,150" stroke="#374151" stroke-width="2.5" marker-end="url(#ar)"/>
<text x="62" y="138" font-size="12" text-anchor="middle" fill="#374151">start</text>
<!-- states -->
<circle cx="170" cy="150" r="58" fill="#fee2e2" stroke="#b42318" stroke-width="2.5"/>
<text x="170" y="148" font-size="16" font-weight="bold" text-anchor="middle" fill="#111827">RED</text>
<text x="170" y="167" font-size="12" text-anchor="middle" fill="#374151">cars stop</text>
<circle cx="598" cy="150" r="58" fill="#dcfce7" stroke="#15803d" stroke-width="2.5"/>
<text x="598" y="148" font-size="16" font-weight="bold" text-anchor="middle" fill="#111827">GREEN</text>
<text x="598" y="167" font-size="12" text-anchor="middle" fill="#374151">cars go</text>
<circle cx="384" cy="290" r="58" fill="#fef3c7" stroke="#a16207" stroke-width="2.5"/>
<text x="384" y="288" font-size="16" font-weight="bold" text-anchor="middle" fill="#111827">YELLOW</text>
<text x="384" y="307" font-size="12" text-anchor="middle" fill="#374151">slow down</text>
<!-- transitions -->
<g stroke="#374151" stroke-width="2.5" fill="none">
<path d="M228,150 L538,150" marker-end="url(#ar)"/>
<path d="M549,182 L434,257" marker-end="url(#ar)"/>
<path d="M335,258 L220,183" marker-end="url(#ar)"/>
</g>
<text x="384" y="140" font-size="13" text-anchor="middle" fill="#111827">after 30 seconds</text>
<text x="502" y="238" font-size="13" fill="#111827">after 25 seconds</text>
<text x="266" y="238" font-size="13" text-anchor="end" fill="#111827">after 3 seconds</text>
</svg>
