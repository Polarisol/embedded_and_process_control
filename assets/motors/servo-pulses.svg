<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 768 400" width="768" height="400" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#15803d"/></marker><marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#a16207"/></marker></defs>
<rect width="768" height="400" rx="10" fill="#ffffff"/>
<text x="384" y="28" font-size="17" font-weight="bold" text-anchor="middle" fill="#111827">The pulse width tells the servo what to do</text>
<text x="200" y="62" font-size="13" font-weight="bold" text-anchor="middle" fill="#111827">Signal (one pulse every 20 ms)</text>
<text x="500" y="62" font-size="13" font-weight="bold" text-anchor="middle" fill="#111827">Positional servo</text>
<text x="670" y="62" font-size="13" font-weight="bold" text-anchor="middle" fill="#111827">Continuous servo</text>
<polyline fill="none" stroke="#a16207" stroke-width="2.5" stroke-linejoin="round"  points="40,144 60,144 60,100 84.0,100 84.0,144 330,144"/>
<line x1="60" y1="92" x2="84.0" y2="92" stroke="#374151" stroke-width="1"/>
<text x="92.0" y="104" font-size="14" font-weight="bold" text-anchor="start" fill="#a16207">0.5 ms</text>
<text x="92.0" y="122" font-size="12" text-anchor="start" fill="#374151">= 500 µs</text>
<text x="330" y="136" font-size="11" text-anchor="end" fill="#374151">…then low until the next pulse</text>
<path d="M454,144 A46,46 0 0 1 546,144" fill="#eef0f2" stroke="#9ca3af" stroke-width="1.5"/>
<text x="552" y="148" font-size="11" text-anchor="start" fill="#374151">0°</text>
<text x="448" y="148" font-size="11" text-anchor="end" fill="#374151">180°</text>
<line x1="500" y1="144" x2="540.0" y2="144.0" stroke="#1d4ed8" stroke-width="6" stroke-linecap="round"/>
<circle cx="500" cy="144" r="6" fill="#1d4ed8"/>
<text x="500" y="166" font-size="14" font-weight="bold" text-anchor="middle" fill="#1d4ed8">0°</text>
<path d="M652,118 A18,18 0 1 1 670,136" fill="none" stroke="#15803d" stroke-width="3" marker-end="url(#ar)"/>
<text x="670" y="158" font-size="12" text-anchor="middle" fill="#374151">full speed one way</text>
<polyline fill="none" stroke="#a16207" stroke-width="2.5" stroke-linejoin="round"  points="40,236 60,236 60,192 132.0,192 132.0,236 330,236"/>
<line x1="60" y1="184" x2="132.0" y2="184" stroke="#374151" stroke-width="1"/>
<text x="140.0" y="196" font-size="14" font-weight="bold" text-anchor="start" fill="#a16207">1.5 ms</text>
<text x="140.0" y="214" font-size="12" text-anchor="start" fill="#374151">= 1500 µs</text>
<path d="M454,236 A46,46 0 0 1 546,236" fill="#eef0f2" stroke="#9ca3af" stroke-width="1.5"/>
<text x="552" y="240" font-size="11" text-anchor="start" fill="#374151">0°</text>
<text x="448" y="240" font-size="11" text-anchor="end" fill="#374151">180°</text>
<line x1="500" y1="236" x2="500.0" y2="196.0" stroke="#1d4ed8" stroke-width="6" stroke-linecap="round"/>
<circle cx="500" cy="236" r="6" fill="#1d4ed8"/>
<text x="500" y="258" font-size="14" font-weight="bold" text-anchor="middle" fill="#1d4ed8">90°</text>
<circle cx="670" cy="210" r="18" fill="none" stroke="#9ca3af" stroke-width="2.5"/>
<rect x="663" y="203" width="14" height="14" fill="#b42318"/>
<text x="670" y="250" font-size="12" text-anchor="middle" fill="#374151">stop</text>
<polyline fill="none" stroke="#a16207" stroke-width="2.5" stroke-linejoin="round"  points="40,328 60,328 60,284 175.2,284 175.2,328 330,328"/>
<line x1="60" y1="276" x2="175.2" y2="276" stroke="#374151" stroke-width="1"/>
<text x="183.2" y="288" font-size="14" font-weight="bold" text-anchor="start" fill="#a16207">2.4 ms</text>
<text x="183.2" y="306" font-size="12" text-anchor="start" fill="#374151">= 2400 µs</text>
<path d="M454,328 A46,46 0 0 1 546,328" fill="#eef0f2" stroke="#9ca3af" stroke-width="1.5"/>
<text x="552" y="332" font-size="11" text-anchor="start" fill="#374151">0°</text>
<text x="448" y="332" font-size="11" text-anchor="end" fill="#374151">180°</text>
<line x1="500" y1="328" x2="460.0" y2="328.0" stroke="#1d4ed8" stroke-width="6" stroke-linecap="round"/>
<circle cx="500" cy="328" r="6" fill="#1d4ed8"/>
<text x="500" y="350" font-size="14" font-weight="bold" text-anchor="middle" fill="#1d4ed8">180°</text>
<path d="M688,302 A18,18 0 1 0 670,320" fill="none" stroke="#15803d" stroke-width="3" marker-end="url(#ar)"/>
<text x="670" y="342" font-size="12" text-anchor="middle" fill="#374151">full speed the other way</text>
<text x="384" y="385" font-size="12" text-anchor="middle" fill="#374151">Most small servos (like the SG90) use about 0.5 ms to 2.4 ms. The exact numbers change a little from servo to servo.</text>
</svg>
