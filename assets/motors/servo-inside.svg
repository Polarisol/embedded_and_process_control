<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 768 340" width="768" height="340" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#15803d"/></marker><marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#a16207"/></marker></defs>
<rect width="768" height="340" rx="10" fill="#ffffff"/>
<text x="384" y="28" font-size="17" font-weight="bold" text-anchor="middle" fill="#111827">Inside a servo: a motor that checks where it is</text>
<text x="70" y="108" font-size="13" font-weight="bold" text-anchor="middle" fill="#a16207">pulse</text>
<text x="70" y="126" font-size="11" text-anchor="middle" fill="#374151">from the board</text>
<polyline fill="none" stroke="#a16207" stroke-width="2" stroke-linejoin="round"  points="20,150 40,150 40,136 64,136 64,150 110,150"/>
<rect x="120" y="90" width="150" height="80" rx="8" fill="#e0ecfb" stroke="#1d4ed8" stroke-width="2"/>
<text x="195.0" y="128.0" font-size="14" font-weight="bold" text-anchor="middle" fill="#111827">Control chip</text>
<text x="195.0" y="146.0" font-size="11" text-anchor="middle" fill="#374151">compares the two</text>
<rect x="310" y="90" width="120" height="80" rx="8" fill="#cbd5e1" stroke="#475569" stroke-width="2"/>
<text x="370.0" y="128.0" font-size="14" font-weight="bold" text-anchor="middle" fill="#111827">DC motor</text>
<text x="370.0" y="146.0" font-size="11" text-anchor="middle" fill="#374151">small and fast</text>
<rect x="470" y="90" width="120" height="80" rx="8" fill="#fef3c7" stroke="#a16207" stroke-width="2"/>
<text x="530.0" y="128.0" font-size="14" font-weight="bold" text-anchor="middle" fill="#111827">Gears</text>
<text x="530.0" y="146.0" font-size="11" text-anchor="middle" fill="#374151">slower but stronger</text>
<rect x="630" y="90" width="120" height="80" rx="8" fill="#f3f4f6" stroke="#475569" stroke-width="2"/>
<text x="690.0" y="128.0" font-size="14" font-weight="bold" text-anchor="middle" fill="#111827">Output</text>
<text x="690.0" y="146.0" font-size="11" text-anchor="middle" fill="#374151">the horn turns</text>
<line x1="272" y1="130" x2="308" y2="130" stroke="#15803d" stroke-width="3" marker-end="url(#ar)"/>
<line x1="432" y1="130" x2="468" y2="130" stroke="#15803d" stroke-width="3" marker-end="url(#ar)"/>
<line x1="592" y1="130" x2="628" y2="130" stroke="#15803d" stroke-width="3" marker-end="url(#ar)"/>
<rect x="560" y="200" width="190" height="64" rx="8" fill="#dff3e4" stroke="#15803d" stroke-width="2"/>
<text x="655.0" y="230.0" font-size="14" font-weight="bold" text-anchor="middle" fill="#111827">Potentiometer</text>
<text x="655.0" y="248.0" font-size="11" text-anchor="middle" fill="#374151">measures the angle</text>
<line x1="690" y1="172" x2="690" y2="196" stroke="#15803d" stroke-width="3" marker-end="url(#ar)"/>
<polyline fill="none" stroke="#15803d" stroke-width="3" stroke-linejoin="round" marker-end="url(#ar)" points="560,232 195,232 195,176"/>
<text x="380" y="224" font-size="13" font-weight="bold" text-anchor="middle" fill="#15803d">"Where am I now?"</text>
<text x="384" y="300" font-size="12" text-anchor="middle" fill="#374151">The chip turns the motor until the angle measured by the potentiometer matches the angle in the pulse.</text>
<text x="384" y="320" font-size="12" text-anchor="middle" fill="#374151">A continuous servo has no working potentiometer, so the pulse sets the speed and direction instead.</text>
</svg>
