<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 768 380" width="768" height="380" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#15803d"/></marker>
<marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/></marker></defs>
<rect width="768" height="380" rx="10" fill="#ffffff"/>
<text x="384" y="28" font-size="17" font-weight="bold" text-anchor="middle" fill="#111827">Inside a DC motor</text>
<!-- magnets -->
<rect x="60" y="70" width="90" height="150" rx="6" fill="#fecaca" stroke="#b42318" stroke-width="2"/>
<text x="105" y="155" font-size="30" font-weight="bold" text-anchor="middle" fill="#b42318">N</text>
<rect x="545" y="70" width="70" height="150" rx="6" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
<text x="580" y="155" font-size="30" font-weight="bold" text-anchor="middle" fill="#1d4ed8">S</text>
<text x="105" y="240" font-size="12" text-anchor="middle" fill="#374151">magnet</text>
<text x="580" y="240" font-size="12" text-anchor="middle" fill="#374151">magnet</text>
<!-- axle -->
<line x1="340" y1="96" x2="340" y2="300" stroke="#6b7280" stroke-width="4" stroke-dasharray="8 5"/>
<!-- coil -->
<polyline points="330,250 330,236 240,236 240,90 440,90 440,236 350,236 350,250" fill="none" stroke="#c2410c" stroke-width="5" stroke-linejoin="round"/>
<text x="340" y="80" font-size="13" font-weight="bold" text-anchor="middle" fill="#c2410c">coil of copper wire</text>
<!-- forces -->
<line x1="222" y1="190" x2="222" y2="110" stroke="#15803d" stroke-width="4" marker-end="url(#ar)"/>
<line x1="458" y1="110" x2="458" y2="190" stroke="#15803d" stroke-width="4" marker-end="url(#ar)"/>
<text x="212" y="200" font-size="12" font-weight="bold" text-anchor="end" fill="#15803d">push up</text>
<text x="466" y="104" font-size="12" font-weight="bold" fill="#15803d">push down</text>
<!-- commutator -->
<circle cx="340" cy="272" r="22" fill="none" stroke="#c2410c" stroke-width="8" stroke-dasharray="64 5.1" stroke-dashoffset="-34"/>
<rect x="296" y="264" width="16" height="16" rx="2" fill="#374151"/>
<rect x="368" y="264" width="16" height="16" rx="2" fill="#374151"/>
<text x="340" y="320" font-size="12" text-anchor="middle" fill="#374151">commutator (split ring) + brushes</text>
<!-- battery -->
<line x1="296" y1="272" x2="200" y2="272" stroke="#b42318" stroke-width="2.5"/>
<line x1="200" y1="272" x2="200" y2="350" stroke="#b42318" stroke-width="2.5"/>
<line x1="200" y1="350" x2="320" y2="350" stroke="#b42318" stroke-width="2.5"/>
<line x1="384" y1="272" x2="480" y2="272" stroke="#111827" stroke-width="2.5"/>
<line x1="480" y1="272" x2="480" y2="350" stroke="#111827" stroke-width="2.5"/>
<line x1="480" y1="350" x2="360" y2="350" stroke="#111827" stroke-width="2.5"/>
<line x1="320" y1="336" x2="320" y2="364" stroke="#111827" stroke-width="3"/>
<line x1="334" y1="342" x2="334" y2="358" stroke="#111827" stroke-width="3"/>
<line x1="346" y1="336" x2="346" y2="364" stroke="#111827" stroke-width="3"/>
<line x1="360" y1="342" x2="360" y2="358" stroke="#111827" stroke-width="3"/>
<text x="312" y="340" font-size="13" font-weight="bold" text-anchor="end" fill="#b42318">+</text>
<text x="404" y="370" font-size="12" fill="#374151">battery</text>
<!-- explanation -->
<rect x="628" y="60" width="132" height="270" rx="8" fill="#dff3e4"/>
<g font-size="13" fill="#111827" text-anchor="middle">
<text x="694" y="86" font-weight="bold" fill="#15803d">How it spins</text>
<text x="694" y="114">1. Current flows</text>
<text x="694" y="132">through the coil.</text>
<text x="694" y="164">2. The magnets push</text>
<text x="694" y="182">one side up and the</text>
<text x="694" y="200">other side down.</text>
<text x="694" y="232">3. Every half turn the</text>
<text x="694" y="250">commutator flips the</text>
<text x="694" y="268">current, so the push</text>
<text x="694" y="286">never stops.</text>
</g>
</svg>
