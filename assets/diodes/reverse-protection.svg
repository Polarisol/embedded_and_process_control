<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 768 340" width="768" height="340" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#111827"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15803d"/></marker><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b42318"/></marker><marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker></defs>
<rect width="768" height="340" rx="10" fill="#ffffff"/>
<text x="384.0" y="28" font-size="17" font-weight="bold" text-anchor="middle" fill="#111827">One diode protects against a battery connected backwards</text>
<text x="192" y="62" font-size="16" font-weight="bold" text-anchor="middle" fill="#15803d">Battery the right way</text>
<line x1="60" y1="100" x2="60" y2="172" stroke="#111827" stroke-width="2.5"/>
<line x1="60" y1="196" x2="60" y2="260" stroke="#111827" stroke-width="2.5"/>
<line x1="42" y1="172" x2="78" y2="172" stroke="#111827" stroke-width="3"/>
<line x1="51" y1="180" x2="69" y2="180" stroke="#111827" stroke-width="5"/>
<line x1="42" y1="188" x2="78" y2="188" stroke="#111827" stroke-width="3"/>
<line x1="51" y1="196" x2="69" y2="196" stroke="#111827" stroke-width="5"/>
<text x="36" y="176" font-size="15" font-weight="bold" text-anchor="end" fill="#b42318">+</text>
<text x="84" y="188" font-size="13" font-weight="bold" text-anchor="start" fill="#111827">9 V</text>
<line x1="60" y1="100" x2="112.0" y2="100.0" stroke="#111827" stroke-width="2.5"/>
<line x1="148.0" y1="100.0" x2="200" y2="100" stroke="#111827" stroke-width="2.5"/>
<polygon points="112.0,118.0 112.0,82.0 148.0,100.0" fill="#fecaca" stroke="#111827" stroke-width="2.5" stroke-linejoin="round"/>
<line x1="148.0" y1="118.0" x2="148.0" y2="82.0" stroke="#111827" stroke-width="3"/>
<line x1="200" y1="100" x2="260" y2="100" stroke="#111827" stroke-width="2.5"/>
<rect x="240" y="120" width="110" height="110" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2.5"/>
<text x="295" y="170" font-size="14" font-weight="bold" text-anchor="middle" fill="#92400e">your</text>
<text x="295" y="188" font-size="14" font-weight="bold" text-anchor="middle" fill="#92400e">circuit</text>
<polyline points="260,100 295,100 295,120" fill="none" stroke="#111827" stroke-width="2.5" stroke-linejoin="round"/>
<polyline points="295,230 295,260 60,260" fill="none" stroke="#111827" stroke-width="2.5" stroke-linejoin="round"/>
<line x1="90" y1="128" x2="180" y2="128" stroke="#15803d" stroke-width="2.5" marker-end="url(#ag)"/>
<text x="135" y="148" font-size="12" font-weight="bold" text-anchor="middle" fill="#15803d">current</text>
<text x="192" y="296" font-size="13" text-anchor="middle" fill="#374151">The diode conducts and the circuit</text>
<text x="192" y="314" font-size="13" text-anchor="middle" fill="#374151">works, with about 0.7 V less.</text>
<text x="576" y="62" font-size="16" font-weight="bold" text-anchor="middle" fill="#b42318">Battery backwards</text>
<line x1="444" y1="100" x2="444" y2="172" stroke="#111827" stroke-width="2.5"/>
<line x1="444" y1="196" x2="444" y2="260" stroke="#111827" stroke-width="2.5"/>
<line x1="435" y1="172" x2="453" y2="172" stroke="#111827" stroke-width="5"/>
<line x1="426" y1="180" x2="462" y2="180" stroke="#111827" stroke-width="3"/>
<line x1="435" y1="188" x2="453" y2="188" stroke="#111827" stroke-width="5"/>
<line x1="426" y1="196" x2="462" y2="196" stroke="#111827" stroke-width="3"/>
<text x="420" y="206" font-size="15" font-weight="bold" text-anchor="end" fill="#b42318">+</text>
<text x="468" y="188" font-size="13" font-weight="bold" text-anchor="start" fill="#111827">9 V</text>
<line x1="444" y1="100" x2="496.0" y2="100.0" stroke="#111827" stroke-width="2.5"/>
<line x1="532.0" y1="100.0" x2="584" y2="100" stroke="#111827" stroke-width="2.5"/>
<polygon points="496.0,118.0 496.0,82.0 532.0,100.0" fill="#fecaca" stroke="#111827" stroke-width="2.5" stroke-linejoin="round"/>
<line x1="532.0" y1="118.0" x2="532.0" y2="82.0" stroke="#111827" stroke-width="3"/>
<line x1="584" y1="100" x2="644" y2="100" stroke="#111827" stroke-width="2.5"/>
<rect x="624" y="120" width="110" height="110" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="2.5"/>
<text x="679" y="170" font-size="14" font-weight="bold" text-anchor="middle" fill="#374151">your</text>
<text x="679" y="188" font-size="14" font-weight="bold" text-anchor="middle" fill="#374151">circuit</text>
<polyline points="644,100 679,100 679,120" fill="none" stroke="#111827" stroke-width="2.5" stroke-linejoin="round"/>
<polyline points="679,230 679,260 444,260" fill="none" stroke="#111827" stroke-width="2.5" stroke-linejoin="round"/>
<text x="514" y="140" font-size="14" font-weight="bold" text-anchor="middle" fill="#b42318">✕ blocked</text>
<text x="576" y="296" font-size="13" text-anchor="middle" fill="#374151">The diode blocks. Nothing flows,</text>
<text x="576" y="314" font-size="13" text-anchor="middle" fill="#374151">and nothing is damaged.</text>
<line x1="384" y1="50" x2="384" y2="326" stroke="#e5e7eb" stroke-width="2"/>
</svg>
