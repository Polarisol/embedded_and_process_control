<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 768 300" width="768" height="300" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#111827"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15803d"/></marker><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b42318"/></marker><marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker></defs>
<rect width="768" height="300" rx="10" fill="#ffffff"/>
<text x="384.0" y="28" font-size="17" font-weight="bold" text-anchor="middle" fill="#111827">What a diode looks like, and how it is drawn in a circuit</text>
<text x="200" y="64" font-size="14" font-weight="bold" text-anchor="middle" fill="#1d4ed8">The real part</text>
<rect x="60.0" y="137.5" width="280" height="5" rx="2" fill="#9ca3af" stroke="none" stroke-width="2"/>
<rect x="140.0" y="122.0" width="120" height="36" rx="5" fill="#1f2937" stroke="none" stroke-width="2"/>
<rect x="234.0" y="122.0" width="14" height="36" rx="0" fill="#d1d5db" stroke="none" stroke-width="2"/>
<text x="190" y="145" font-size="12" font-weight="bold" text-anchor="middle" fill="#e5e7eb">1N4007</text>
<text x="80" y="186" font-size="13" font-weight="bold" text-anchor="middle" fill="#b42318">Anode (+)</text>
<text x="80" y="202" font-size="12" text-anchor="middle" fill="#374151">no stripe</text>
<text x="320" y="186" font-size="13" font-weight="bold" text-anchor="middle" fill="#111827">Cathode (−)</text>
<text x="320" y="202" font-size="12" text-anchor="middle" fill="#374151">the stripe end</text>
<line x1="300" y1="92" x2="250" y2="116" stroke="#111827" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="306" y="90" font-size="12" text-anchor="start" fill="#374151">silver stripe</text>
<line x1="424" y1="50" x2="424" y2="284" stroke="#e5e7eb" stroke-width="2"/>
<text x="600" y="64" font-size="14" font-weight="bold" text-anchor="middle" fill="#1d4ed8">The circuit symbol</text>
<line x1="460" y1="140" x2="582.0" y2="140.0" stroke="#111827" stroke-width="2.5"/>
<line x1="618.0" y1="140.0" x2="740" y2="140" stroke="#111827" stroke-width="2.5"/>
<polygon points="582.0,158.0 582.0,122.0 618.0,140.0" fill="#fecaca" stroke="#111827" stroke-width="2.5" stroke-linejoin="round"/>
<line x1="618.0" y1="158.0" x2="618.0" y2="122.0" stroke="#111827" stroke-width="3"/>
<circle cx="460" cy="140" r="4" fill="#111827"/>
<circle cx="740" cy="140" r="4" fill="#111827"/>
<text x="510" y="170" font-size="13" font-weight="bold" text-anchor="middle" fill="#b42318">Anode (+)</text>
<text x="690" y="170" font-size="13" font-weight="bold" text-anchor="middle" fill="#111827">Cathode (−)</text>
<line x1="490" y1="210" x2="710" y2="210" stroke="#15803d" stroke-width="2.5" marker-end="url(#ag)"/>
<text x="600" y="200" font-size="13" text-anchor="middle" fill="#15803d">current flows this way only</text>
<text x="600" y="250" font-size="12" text-anchor="middle" fill="#374151">The triangle points the way current flows.</text>
<text x="600" y="268" font-size="12" text-anchor="middle" fill="#374151">The bar is the cathode, just like the stripe.</text>
</svg>
