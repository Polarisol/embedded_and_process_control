<text x="420" y="124.8" font-size="13" font-weight="bold" text-anchor="start" fill="#15803d">logic-level MOSFET</text>
<text x="420" y="140.8" font-size="12" text-anchor="start" fill="#15803d">(e.g. AO3400A): fully ON</text>
<text x="420" y="155.8" font-size="12" text-anchor="start" fill="#15803d">well before 3.3 V</text>
<text x="590" y="272.8" font-size="13" font-weight="bold" text-anchor="start" fill="#b42318">standard MOSFET</text>
<text x="590" y="288.8" font-size="12" text-anchor="start" fill="#b42318">(e.g. IRF520):</text>
<text x="590" y="303.8" font-size="12" text-anchor="start" fill="#b42318">barely ON at 3.3 V</text>
<circle cx="180" cy="330" r="4" fill="#15803d"/>
<text x="180" y="320" font-size="11" font-weight="bold" text-anchor="middle" fill="#15803d">V_GS(th)</text>
<circle cx="380" cy="330" r="4" fill="#b42318"/>
<text x="376" y="320" font-size="11" font-weight="bold" text-anchor="end" fill="#b42318">V_GS(th)</text>
<text x="384" y="388" font-size="12" text-anchor="middle" fill="#374151">V_GS(th) is where the MOSFET only just starts to conduct. Fully ON needs a good margin above it.</text>
