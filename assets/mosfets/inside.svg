<text x="384" y="305" font-size="12" text-anchor="middle" fill="#374151">The gate is a metal plate on a very thin layer of glass-like insulator (yellow). No current flows into it.</text>
<text x="384" y="322" font-size="12" text-anchor="middle" fill="#374151">A positive gate voltage pulls electrons to the surface and builds a thin channel (blue) that joins source and drain.</text>
