<g font-size="13" fill="#374151">
<text x="480" y="70">Inside the breadboard, each column of</text>
<text x="480" y="88">5 holes (a–e, or f–j) is one metal strip.</text>
<text x="480" y="116" fill="#ea580c" font-weight="bold">Orange: column 5, legs 1 and 2.</text>
<text x="480" y="134" fill="#ea580c">All 10 holes are connected.</text>
<text x="480" y="160" fill="#7c3aed" font-weight="bold">Purple: column 7, legs 3 and 4.</text>
<text x="480" y="178" fill="#7c3aed">All 10 holes are connected.</text>
<text x="480" y="206" fill="#111827" font-weight="bold">Press: orange and purple connect.</text>
</g>
<rect x="476" y="224" width="276" height="88" rx="8" fill="#fef3c7"/>
<g font-size="12.5" fill="#374151">
<text x="488" y="246" font-weight="bold" fill="#a16207">Tip: not sure which legs are which?</text>
<text x="488" y="266">Use two legs that are diagonal to each</text>
<text x="488" y="284">other (1 and 4, or 2 and 3). They are</text>
<text x="488" y="302">always on different sides of the switch.</text>
