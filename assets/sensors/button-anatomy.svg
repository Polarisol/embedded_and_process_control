<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 768 320" width="768" height="320" font-family="Helvetica, Arial, sans-serif">
<rect width="768" height="320" rx="10" fill="#ffffff"/>
<text x="384" y="28" font-size="17" font-weight="bold" text-anchor="middle" fill="#111827">Inside a push button (the 6 × 6 mm "tactile switch")</text>
<!-- panel A: side view -->
<text x="145" y="62" font-size="14" font-weight="bold" text-anchor="middle" fill="#1d4ed8">Side view, cut open</text>
<rect x="117" y="96" width="36" height="44" rx="4" fill="#374151"/>
<text x="135" y="88" font-size="12" text-anchor="middle" fill="#374151">plunger (you press here)</text>
<path d="M66,176 Q135,118 204,176" fill="none" stroke="#a16207" stroke-width="3.5"/>
<line x1="50" y1="140" x2="78" y2="164" stroke="#6b7280" stroke-width="1.2"/>
<text x="24" y="118" font-size="12" fill="#a16207">metal dome</text>
<text x="24" y="133" font-size="12" fill="#a16207">(the spring)</text>
<rect x="56" y="176" width="26" height="7" fill="#d4a017"/>
<rect x="188" y="176" width="26" height="7" fill="#d4a017"/>
<rect x="122" y="176" width="26" height="7" fill="#d4a017"/>
<rect x="48" y="183" width="174" height="44" rx="3" fill="#9ca3af"/>
<text x="135" y="210" font-size="12" text-anchor="middle" fill="#ffffff">plastic base</text>
<line x1="216" y1="168" x2="204" y2="176" stroke="#6b7280" stroke-width="1.2"/>
<text x="212" y="162" font-size="12" fill="#a16207">contacts</text>
<line x1="60" y1="227" x2="60" y2="268" stroke="#6b7280" stroke-width="4"/>
<line x1="210" y1="227" x2="210" y2="268" stroke="#6b7280" stroke-width="4"/>
<text x="135" y="256" font-size="12" text-anchor="middle" fill="#374151">legs (metal pins)</text>
<text x="145" y="292" font-size="12" text-anchor="middle" fill="#374151">Press: the dome snaps down and touches</text>
<text x="145" y="308" font-size="12" text-anchor="middle" fill="#374151">the middle contact. Let go: it springs back.</text>
<!-- panel B: top view -->
<text x="405" y="62" font-size="14" font-weight="bold" text-anchor="middle" fill="#1d4ed8">Top view: the 4 legs</text>
<line x1="315" y1="120" x2="350" y2="120" stroke="#ea580c" stroke-width="6"/>
<line x1="460" y1="120" x2="495" y2="120" stroke="#ea580c" stroke-width="6"/>
<line x1="315" y1="210" x2="350" y2="210" stroke="#7c3aed" stroke-width="6"/>
<line x1="460" y1="210" x2="495" y2="210" stroke="#7c3aed" stroke-width="6"/>
<rect x="345" y="105" width="120" height="120" rx="6" fill="#e5e7eb" stroke="#6b7280" stroke-width="2"/>
<line x1="350" y1="120" x2="460" y2="120" stroke="#ea580c" stroke-width="4" stroke-dasharray="6 4"/>
<line x1="350" y1="210" x2="460" y2="210" stroke="#7c3aed" stroke-width="4" stroke-dasharray="6 4"/>
<circle cx="405" cy="165" r="30" fill="#374151"/>
<text x="305" y="125" font-size="14" font-weight="bold" text-anchor="end" fill="#ea580c">1</text>
<text x="505" y="125" font-size="14" font-weight="bold" fill="#ea580c">2</text>
<text x="305" y="215" font-size="14" font-weight="bold" text-anchor="end" fill="#7c3aed">3</text>
<text x="505" y="215" font-size="14" font-weight="bold" fill="#7c3aed">4</text>
<text x="405" y="254" font-size="13" text-anchor="middle" fill="#ea580c">1 and 2 are always connected</text>
<text x="405" y="274" font-size="13" text-anchor="middle" fill="#7c3aed">3 and 4 are always connected</text>
<text x="405" y="298" font-size="13" font-weight="bold" text-anchor="middle" fill="#111827">Pressing connects 1–2 to 3–4</text>
<!-- panel C: symbol -->
<text x="650" y="62" font-size="14" font-weight="bold" text-anchor="middle" fill="#1d4ed8">Circuit symbol</text>
<line x1="580" y1="120" x2="720" y2="120" stroke="#ea580c" stroke-width="2.5"/>
<line x1="580" y1="210" x2="720" y2="210" stroke="#7c3aed" stroke-width="2.5"/>
<circle cx="580" cy="120" r="3.5" fill="#ea580c"/><circle cx="720" cy="120" r="3.5" fill="#ea580c"/>
<circle cx="580" cy="210" r="3.5" fill="#7c3aed"/><circle cx="720" cy="210" r="3.5" fill="#7c3aed"/>
<text x="570" y="125" font-size="13" font-weight="bold" text-anchor="end" fill="#ea580c">1</text>
<text x="730" y="125" font-size="13" font-weight="bold" fill="#ea580c">2</text>
<text x="570" y="215" font-size="13" font-weight="bold" text-anchor="end" fill="#7c3aed">3</text>
<text x="730" y="215" font-size="13" font-weight="bold" fill="#7c3aed">4</text>
<line x1="650" y1="120" x2="650" y2="146" stroke="#111827" stroke-width="2.5"/>
<line x1="650" y1="184" x2="650" y2="210" stroke="#111827" stroke-width="2.5"/>
<circle cx="650" cy="150" r="4" fill="#ffffff" stroke="#111827" stroke-width="2.5"/>
<circle cx="650" cy="180" r="4" fill="#ffffff" stroke="#111827" stroke-width="2.5"/>
<line x1="634" y1="140" x2="634" y2="190" stroke="#111827" stroke-width="3"/>
<line x1="634" y1="165" x2="610" y2="165" stroke="#111827" stroke-width="2.5"/>
<line x1="610" y1="155" x2="610" y2="175" stroke="#111827" stroke-width="2.5"/>
<text x="650" y="254" font-size="13" text-anchor="middle" fill="#374151">Released: open circuit</text>
<text x="650" y="274" font-size="13" text-anchor="middle" fill="#374151">Pressed: closed circuit</text>
</svg>
