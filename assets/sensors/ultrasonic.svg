<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 768 300" width="768" height="300" font-family="Helvetica, Arial, sans-serif">
<rect width="768" height="300" rx="10" fill="#ffffff"/>
<text x="384" y="28" font-size="17" font-weight="bold" text-anchor="middle" fill="#111827">Ultrasonic sensor (HC-SR04): distance from an echo</text>
<!-- sensor -->
<rect x="24" y="60" width="150" height="70" rx="6" fill="#1d4ed8"/>
<circle cx="64" cy="95" r="24" fill="#d1d5db" stroke="#374151" stroke-width="3"/>
<circle cx="134" cy="95" r="24" fill="#d1d5db" stroke="#374151" stroke-width="3"/>
<circle cx="64" cy="95" r="10" fill="#6b7280"/>
<circle cx="134" cy="95" r="10" fill="#6b7280"/>
<text x="64" y="145" font-size="11" text-anchor="middle" fill="#374151">speaker</text>
<text x="134" y="145" font-size="11" text-anchor="middle" fill="#374151">microphone</text>
<!-- waves -->
<g fill="none" stroke="#a16207" stroke-width="2.5">
<path d="M196,75 q10,20 0,40"/><path d="M216,70 q14,25 0,50"/><path d="M236,65 q18,30 0,60"/>
</g>
<line x1="260" y1="84" x2="420" y2="84" stroke="#a16207" stroke-width="2" stroke-dasharray="6 4"/>
<polygon points="430,84 418,78 418,90" fill="#a16207"/>
<line x1="430" y1="108" x2="200" y2="108" stroke="#15803d" stroke-width="2" stroke-dasharray="6 4"/>
<polygon points="190,108 202,102 202,114" fill="#15803d"/>
<text x="340" y="74" font-size="12" text-anchor="middle" fill="#a16207">40 kHz "ping" goes out</text>
<text x="320" y="126" font-size="12" text-anchor="middle" fill="#15803d">echo comes back</text>
<rect x="444" y="52" width="26" height="92" rx="3" fill="#9ca3af"/>
<text x="457" y="162" font-size="12" text-anchor="middle" fill="#374151">object</text>
<!-- formula -->
<rect x="500" y="56" width="252" height="92" rx="8" fill="#dff3e4"/>
<text x="626" y="82" font-size="13" text-anchor="middle" fill="#374151">Sound travels 0.0343 cm per µs</text>
<text x="626" y="106" font-size="13" text-anchor="middle" fill="#374151">and makes the trip twice, so</text>
<text x="626" y="132" font-size="15" font-weight="bold" text-anchor="middle" fill="#15803d">cm = µs × 0.0343 / 2</text>
<!-- timing -->
<text x="70" y="208" font-size="14" font-weight="bold" text-anchor="end" fill="#b42318">TRIG</text>
<polyline fill="none" stroke="#b42318" stroke-width="3" stroke-linejoin="round" points="84,214 120,214 120,188 140,188 140,214 740,214"/>
<text x="130" y="182" font-size="11" text-anchor="middle" fill="#b42318">10 µs</text>
<text x="70" y="268" font-size="14" font-weight="bold" text-anchor="end" fill="#1d4ed8">ECHO</text>
<polyline fill="none" stroke="#1d4ed8" stroke-width="3" stroke-linejoin="round" points="84,274 220,274 220,246 560,246 560,274 740,274"/>
<line x1="226" y1="262" x2="554" y2="262" stroke="#1d4ed8" stroke-width="1.8"/>
<polygon points="226,262 234,257 234,267" fill="#1d4ed8"/>
<polygon points="554,262 546,257 546,267" fill="#1d4ed8"/>
<text x="390" y="240" font-size="12" text-anchor="middle" fill="#1d4ed8">pin stays HIGH while the sound is travelling: measure it with pulseIn()</text>
</svg>
