<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 768 300" width="768" height="300" font-family="Helvetica, Arial, sans-serif">
<rect width="768" height="300" rx="10" fill="#ffffff"/>
<text x="384" y="28" font-size="17" font-weight="bold" text-anchor="middle" fill="#111827">Software debouncing with debouncedRead()</text>
<text x="410.0" y="86" font-size="15" font-weight="bold" text-anchor="middle" fill="#111827"></text>
<line x1="80" y1="220" x2="740" y2="220" stroke="#9ca3af" stroke-width="1.5"/>
<line x1="80" y1="100" x2="80" y2="220" stroke="#9ca3af" stroke-width="1.5"/>
<text x="74" y="114" font-size="12" text-anchor="end" fill="#374151">HIGH</text>
<text x="74" y="214" font-size="12" text-anchor="end" fill="#374151">LOW</text>
<rect x="200" y="96" width="100" height="123" fill="#fef3c7"/>
<polyline fill="none" stroke="#b42318" stroke-width="2.5" points="80,210 200,210 200,110 212,110 212,210 220,210 220,110 236,110 236,210 241,210 241,110 260,110 260,210 263,210 263,110 740,110"/>
<line x1="200" y1="56" x2="200" y2="232" stroke="#1d4ed8" stroke-width="2" stroke-dasharray="5 3"/>
<line x1="300" y1="56" x2="300" y2="232" stroke="#15803d" stroke-width="2" stroke-dasharray="5 3"/>
<circle cx="200" cy="56" r="11" fill="#1d4ed8"/><text x="200" y="61" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">1</text>
<circle cx="250" cy="250" r="11" fill="#a16207"/><text x="250" y="255" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">2</text>
<circle cx="300" cy="56" r="11" fill="#15803d"/><text x="300" y="61" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">3</text>
<polyline fill="none" stroke="#a16207" stroke-width="1.5" points="200,232 200,238 300,238 300,232"/>
<g font-size="13" fill="#374151">
<text x="190" y="80" text-anchor="end" fill="#1d4ed8">A change! (LOW → HIGH)</text>
<text x="266" y="255" fill="#a16207">delay(5): wait 5 ms for the bouncing to stop</text>
<text x="318" y="80" fill="#15803d">Read again: the pin is steady now,</text>
<text x="318" y="96" fill="#15803d">so return that value</text>
</g>
<text x="384" y="286" font-size="13" text-anchor="middle" fill="#111827">No change? The function returns at once, with no waiting.</text>
</svg>
