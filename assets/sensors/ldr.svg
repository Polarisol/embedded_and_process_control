<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 768 300" width="768" height="300" font-family="Helvetica, Arial, sans-serif">
<rect width="768" height="300" rx="10" fill="#ffffff"/>
<text x="384" y="28" font-size="17" font-weight="bold" text-anchor="middle" fill="#111827">An LDR and a fixed resistor make a light meter</text>
<!-- board -->
<rect x="20" y="50" width="190" height="230" rx="10" fill="#e0ecfb" stroke="#1d4ed8" stroke-width="2"/>
<text x="100" y="130" font-size="15" font-weight="bold" text-anchor="middle" fill="#1d4ed8">Arduino / ESP</text>
<rect x="196" y="72" width="16" height="16" fill="#b42318"/>
<text x="188" y="85" font-size="13" font-weight="bold" text-anchor="end" fill="#b42318">5V / 3.3V</text>
<rect x="196" y="162" width="16" height="16" fill="#15803d"/>
<text x="188" y="175" font-size="13" font-weight="bold" text-anchor="end" fill="#15803d">A0</text>
<rect x="196" y="252" width="16" height="16" fill="#111827"/>
<text x="188" y="265" font-size="13" font-weight="bold" text-anchor="end" fill="#111827">GND</text>
<!-- divider -->
<polyline fill="none" stroke="#111827" stroke-width="2.5" points="212,80 360,80 360,96"/>
<circle cx="360" cy="122" r="26" fill="#fff1cc" stroke="#111827" stroke-width="2"/>
<rect x="352" y="104" width="16" height="36" fill="#ffffff" stroke="#111827" stroke-width="2.5"/>
<line x1="360" y1="96" x2="360" y2="104" stroke="#111827" stroke-width="2.5"/>
<line x1="360" y1="140" x2="360" y2="170" stroke="#111827" stroke-width="2.5"/>
<line x1="306" y1="96" x2="332" y2="112" stroke="#a16207" stroke-width="2.2"/>
<polygon points="336,115 324,113 330,104" fill="#a16207"/>
<line x1="302" y1="112" x2="328" y2="128" stroke="#a16207" stroke-width="2.2"/>
<polygon points="332,131 320,129 326,120" fill="#a16207"/>
<text x="396" y="118" font-size="14" font-weight="bold" fill="#a16207">LDR</text>
<text x="396" y="136" font-size="12" fill="#374151">resistance changes</text>
<text x="396" y="151" font-size="12" fill="#374151">with light</text>
<circle cx="360" cy="170" r="3.5" fill="#111827"/>
<line x1="212" y1="170" x2="360" y2="170" stroke="#15803d" stroke-width="2.5"/>
<line x1="360" y1="170" x2="360" y2="196" stroke="#111827" stroke-width="2.5"/>
<rect x="352" y="196" width="16" height="36" fill="#ffffff" stroke="#111827" stroke-width="2.5"/>
<text x="384" y="220" font-size="13" fill="#374151">10 kΩ (fixed)</text>
<polyline fill="none" stroke="#111827" stroke-width="2.5" points="360,232 360,260 212,260"/>
<!-- states -->
<rect x="540" y="56" width="212" height="104" rx="8" fill="#fff1cc"/>
<g transform="translate(572,82)" stroke="#a16207" stroke-width="2.2"><circle r="9" fill="#facc15"/><line x1="0" y1="-14" x2="0" y2="-19"/><line x1="0" y1="14" x2="0" y2="19"/><line x1="-14" y1="0" x2="-19" y2="0"/><line x1="14" y1="0" x2="19" y2="0"/><line x1="10" y1="10" x2="13" y2="13"/><line x1="-10" y1="-10" x2="-13" y2="-13"/><line x1="10" y1="-10" x2="13" y2="-13"/><line x1="-10" y1="10" x2="-13" y2="13"/></g>
<text x="664" y="88" font-size="15" font-weight="bold" text-anchor="middle" fill="#a16207">Bright light</text>
<text x="646" y="118" font-size="13" text-anchor="middle" fill="#374151">LDR ≈ 1 kΩ (low)</text>
<text x="646" y="144" font-size="14" font-weight="bold" text-anchor="middle" fill="#111827">A0 reads HIGH (≈ 930)</text>
<rect x="540" y="176" width="212" height="104" rx="8" fill="#e5e7eb"/>
<path d="M578,194 a14,14 0 1 0 12,22 a11,11 0 1 1 -12,-22 z" fill="#374151"/>
<text x="664" y="208" font-size="15" font-weight="bold" text-anchor="middle" fill="#374151">Dark</text>
<text x="646" y="238" font-size="13" text-anchor="middle" fill="#374151">LDR ≈ 200 kΩ (high)</text>
<text x="646" y="264" font-size="14" font-weight="bold" text-anchor="middle" fill="#111827">A0 reads LOW (≈ 50)</text>
</svg>
