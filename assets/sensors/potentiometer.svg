<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 768 290" width="768" height="290" font-family="Helvetica, Arial, sans-serif">
<rect width="768" height="290" rx="10" fill="#ffffff"/>
<text x="384" y="28" font-size="17" font-weight="bold" text-anchor="middle" fill="#111827">A potentiometer is an adjustable voltage divider</text>
<!-- board -->
<rect x="20" y="50" width="200" height="220" rx="10" fill="#e0ecfb" stroke="#1d4ed8" stroke-width="2"/>
<text x="110" y="80" font-size="15" font-weight="bold" text-anchor="middle" fill="#1d4ed8">Arduino / ESP</text>
<rect x="206" y="92" width="16" height="16" fill="#b42318"/>
<text x="198" y="105" font-size="13" font-weight="bold" text-anchor="end" fill="#b42318">5V / 3.3V</text>
<rect x="206" y="152" width="16" height="16" fill="#15803d"/>
<text x="198" y="165" font-size="13" font-weight="bold" text-anchor="end" fill="#15803d">A0</text>
<rect x="206" y="222" width="16" height="16" fill="#111827"/>
<text x="198" y="235" font-size="13" font-weight="bold" text-anchor="end" fill="#111827">GND</text>
<!-- pot -->
<polyline fill="none" stroke="#111827" stroke-width="2.5" points="222,100 400,100 400,118"/>
<polyline fill="none" stroke="#111827" stroke-width="2.5" stroke-linejoin="round" points="400,118 412,123 388,131 412,139 388,147 412,155 388,163 412,171 388,179 412,187 400,192"/>
<polyline fill="none" stroke="#111827" stroke-width="2.5" points="400,192 400,230 222,230"/>
<line x1="222" y1="160" x2="372" y2="160" stroke="#15803d" stroke-width="2.5"/>
<polygon points="390,160 372,152 372,168" fill="#15803d"/>
<text x="300" y="150" font-size="12" text-anchor="middle" fill="#15803d">wiper (middle leg)</text>
<text x="380" y="132" font-size="13" text-anchor="end" fill="#374151">10 kΩ</text>
<path d="M430,120 A40,40 0 0 1 430,196" fill="none" stroke="#a16207" stroke-width="2" stroke-dasharray="4 3"/>
<polygon points="430,196 438,186 426,184" fill="#a16207"/>
<text x="452" y="194" font-size="12" fill="#a16207">turn the knob</text>
<!-- dials -->
<g font-size="12" text-anchor="middle">
<circle cx="560" cy="110" r="30" fill="#eef0f2" stroke="#6b7280" stroke-width="2"/>
<line x1="560" y1="110" x2="539" y2="131" stroke="#111827" stroke-width="4" stroke-linecap="round"/>
<text x="560" y="160" fill="#374151">0 V</text>
<text x="560" y="178" font-weight="bold" fill="#111827">0</text>
<circle cx="640" cy="110" r="30" fill="#eef0f2" stroke="#6b7280" stroke-width="2"/>
<line x1="640" y1="110" x2="640" y2="80" stroke="#111827" stroke-width="4" stroke-linecap="round"/>
<text x="640" y="160" fill="#374151">2.5 V</text>
<text x="640" y="178" font-weight="bold" fill="#111827">512</text>
<circle cx="720" cy="110" r="30" fill="#eef0f2" stroke="#6b7280" stroke-width="2"/>
<line x1="720" y1="110" x2="741" y2="131" stroke="#111827" stroke-width="4" stroke-linecap="round"/>
<text x="720" y="160" fill="#374151">5 V</text>
<text x="720" y="178" font-weight="bold" fill="#111827">1023</text>
</g>
<rect x="520" y="200" width="236" height="62" rx="8" fill="#dff3e4"/>
<text x="638" y="224" font-size="13" text-anchor="middle" fill="#374151">analogRead(A0) on an Uno</text>
<text x="638" y="246" font-size="13" text-anchor="middle" fill="#374151">(ESP32: 0 – 4095 at 3.3 V)</text>
</svg>
