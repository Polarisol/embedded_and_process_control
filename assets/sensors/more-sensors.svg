<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 768 270" width="768" height="270" font-family="Helvetica, Arial, sans-serif">
<rect width="768" height="270" rx="10" fill="#ffffff"/>
<text x="384" y="28" font-size="17" font-weight="bold" text-anchor="middle" fill="#111827">More simple sensors and how they answer</text>
<!-- thermistor -->
<rect x="16" y="44" width="176" height="210" rx="8" fill="#dff3e4"/>
<line x1="94" y1="120" x2="94" y2="160" stroke="#9ca3af" stroke-width="3"/>
<line x1="114" y1="120" x2="114" y2="160" stroke="#9ca3af" stroke-width="3"/>
<ellipse cx="104" cy="104" rx="20" ry="22" fill="#b45309"/>
<text x="104" y="109" font-size="11" font-weight="bold" text-anchor="middle" fill="#ffffff">NTC</text>
<text x="104" y="186" font-size="15" font-weight="bold" text-anchor="middle" fill="#15803d">Thermistor</text>
<text x="104" y="206" font-size="12" text-anchor="middle" fill="#374151">warmer = less resistance</text>
<text x="104" y="234" font-size="12" font-weight="bold" text-anchor="middle" fill="#15803d">ANALOG</text>
<!-- tilt -->
<rect x="204" y="44" width="176" height="210" rx="8" fill="#e0ecfb"/>
<g transform="rotate(-20 292 100)">
<rect x="262" y="84" width="60" height="32" rx="14" fill="#e5e7eb" stroke="#374151" stroke-width="2.5"/>
<circle cx="278" cy="100" r="10" fill="#6b7280"/>
<line x1="306" y1="116" x2="306" y2="150" stroke="#9ca3af" stroke-width="3"/>
<line x1="314" y1="116" x2="314" y2="150" stroke="#9ca3af" stroke-width="3"/>
</g>
<text x="292" y="186" font-size="15" font-weight="bold" text-anchor="middle" fill="#1d4ed8">Tilt switch</text>
<text x="292" y="206" font-size="12" text-anchor="middle" fill="#374151">a ball rolls onto two contacts</text>
<text x="292" y="234" font-size="12" font-weight="bold" text-anchor="middle" fill="#1d4ed8">DIGITAL</text>
<!-- PIR -->
<rect x="392" y="44" width="176" height="210" rx="8" fill="#e0ecfb"/>
<rect x="444" y="128" width="72" height="20" rx="3" fill="#15803d"/>
<path d="M448,128 a32,40 0 0 1 64,0 z" fill="#f9fafb" stroke="#9ca3af" stroke-width="2"/>
<path d="M458,124 l0,-20 M470,124 l0,-32 M482,124 l0,-36 M494,124 l0,-32 M504,124 l0,-20" stroke="#e5e7eb" stroke-width="2"/>
<text x="480" y="186" font-size="15" font-weight="bold" text-anchor="middle" fill="#1d4ed8">PIR motion</text>
<text x="480" y="206" font-size="12" text-anchor="middle" fill="#374151">sees body heat move</text>
<text x="480" y="234" font-size="12" font-weight="bold" text-anchor="middle" fill="#1d4ed8">DIGITAL</text>
<!-- DHT11 -->
<rect x="580" y="44" width="172" height="210" rx="8" fill="#fde2e1"/>
<rect x="642" y="66" width="48" height="66" rx="4" fill="#38bdf8" stroke="#0369a1" stroke-width="2"/>
<g fill="#0369a1"><rect x="650" y="76" width="32" height="5" rx="2"/><rect x="650" y="88" width="32" height="5" rx="2"/><rect x="650" y="100" width="32" height="5" rx="2"/><rect x="650" y="112" width="32" height="5" rx="2"/></g>
<g stroke="#9ca3af" stroke-width="3"><line x1="650" y1="132" x2="650" y2="160"/><line x1="661" y1="132" x2="661" y2="160"/><line x1="672" y1="132" x2="672" y2="160"/><line x1="683" y1="132" x2="683" y2="160"/></g>
<text x="666" y="186" font-size="15" font-weight="bold" text-anchor="middle" fill="#b42318">DHT11 / DHT22</text>
<text x="666" y="206" font-size="12" text-anchor="middle" fill="#374151">temperature + humidity</text>
<text x="666" y="234" font-size="12" font-weight="bold" text-anchor="middle" fill="#b42318">DIGITAL DATA</text>
</svg>
