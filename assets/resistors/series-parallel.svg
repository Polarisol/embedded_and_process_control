<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 768 330" width="768" height="330" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#111827"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15803d"/></marker><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b42318"/></marker><marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker></defs>
<rect width="768" height="330" rx="10" fill="#ffffff"/>
<text x="384.0" y="28" font-size="17" font-weight="bold" text-anchor="middle" fill="#111827">Combining resistors</text>
<text x="190" y="64" font-size="15" font-weight="bold" text-anchor="middle" fill="#1d4ed8">In series: they add up</text>
<circle cx="40" cy="140" r="4" fill="#111827"/>
<line x1="40" y1="140" x2="70" y2="140" stroke="#111827" stroke-width="2.5"/>
<polyline points="70,140 74.0,140.0 77.42,148.0 84.25,132.0 91.08,148.0 97.92,132.0 104.75,148.0 111.58,132.0 118.42,148.0 125.25,132.0 132.08,148.0 138.92,132.0 145.75,148.0 152.58,132.0 156.0,140.0 160,140" fill="none" stroke="#111827" stroke-width="2.5" stroke-linejoin="round"/>
<line x1="160" y1="140" x2="220" y2="140" stroke="#111827" stroke-width="2.5"/>
<polyline points="220,140 224.0,140.0 227.42,148.0 234.25,132.0 241.08,148.0 247.92,132.0 254.75,148.0 261.58,132.0 268.42,148.0 275.25,132.0 282.08,148.0 288.92,132.0 295.75,148.0 302.58,132.0 306.0,140.0 310,140" fill="none" stroke="#111827" stroke-width="2.5" stroke-linejoin="round"/>
<line x1="310" y1="140" x2="340" y2="140" stroke="#111827" stroke-width="2.5"/>
<circle cx="340" cy="140" r="4" fill="#111827"/>
<text x="115" y="120" font-size="14" font-weight="bold" text-anchor="middle" fill="#111827">1 kΩ</text>
<text x="265" y="120" font-size="14" font-weight="bold" text-anchor="middle" fill="#111827">1 kΩ</text>
<line x1="60" y1="176" x2="320" y2="176" stroke="#15803d" stroke-width="2.5" marker-end="url(#ag)"/>
<text x="190" y="200" font-size="12" text-anchor="middle" fill="#15803d">the same current flows through both</text>
<rect x="60" y="228" width="260" height="70" rx="8" fill="#e0ecfb" stroke="none" stroke-width="2"/>
<text x="190" y="256" font-size="16" font-weight="bold" text-anchor="middle" fill="#111827">R = R1 + R2</text>
<text x="190" y="282" font-size="15" font-weight="bold" text-anchor="middle" fill="#1d4ed8">1 kΩ + 1 kΩ = 2 kΩ</text>
<line x1="384" y1="50" x2="384" y2="310" stroke="#e5e7eb" stroke-width="2"/>
<text x="576" y="64" font-size="15" font-weight="bold" text-anchor="middle" fill="#1d4ed8">In parallel: less than the smallest</text>
<circle cx="430" cy="135" r="4" fill="#111827"/>
<line x1="430" y1="135" x2="470" y2="135" stroke="#111827" stroke-width="2.5"/>
<line x1="470" y1="100" x2="470" y2="170" stroke="#111827" stroke-width="2.5"/>
<line x1="470" y1="100" x2="530" y2="100" stroke="#111827" stroke-width="2.5"/>
<polyline points="530,100 534.0,100.0 537.42,108.0 544.25,92.0 551.08,108.0 557.92,92.0 564.75,108.0 571.58,92.0 578.42,108.0 585.25,92.0 592.08,108.0 598.92,92.0 605.75,108.0 612.58,92.0 616.0,100.0 620,100" fill="none" stroke="#111827" stroke-width="2.5" stroke-linejoin="round"/>
<line x1="620" y1="100" x2="680" y2="100" stroke="#111827" stroke-width="2.5"/>
<line x1="470" y1="170" x2="530" y2="170" stroke="#111827" stroke-width="2.5"/>
<polyline points="530,170 534.0,170.0 537.42,178.0 544.25,162.0 551.08,178.0 557.92,162.0 564.75,178.0 571.58,162.0 578.42,178.0 585.25,162.0 592.08,178.0 598.92,162.0 605.75,178.0 612.58,162.0 616.0,170.0 620,170" fill="none" stroke="#111827" stroke-width="2.5" stroke-linejoin="round"/>
<line x1="620" y1="170" x2="680" y2="170" stroke="#111827" stroke-width="2.5"/>
<line x1="680" y1="100" x2="680" y2="170" stroke="#111827" stroke-width="2.5"/>
<line x1="680" y1="135" x2="720" y2="135" stroke="#111827" stroke-width="2.5"/>
<circle cx="720" cy="135" r="4" fill="#111827"/>
<circle cx="470" cy="135" r="3" fill="#111827"/>
<circle cx="680" cy="135" r="3" fill="#111827"/>
<text x="575" y="84" font-size="14" font-weight="bold" text-anchor="middle" fill="#111827">1 kΩ</text>
<text x="575" y="154" font-size="14" font-weight="bold" text-anchor="middle" fill="#111827">1 kΩ</text>
<text x="576" y="204" font-size="12" text-anchor="middle" fill="#15803d">the current splits between them</text>
<rect x="426" y="228" width="300" height="70" rx="8" fill="#e0ecfb" stroke="none" stroke-width="2"/>
<text x="576" y="256" font-size="16" font-weight="bold" text-anchor="middle" fill="#111827">R = (R1 × R2) / (R1 + R2)</text>
<text x="576" y="282" font-size="15" font-weight="bold" text-anchor="middle" fill="#1d4ed8">two 1 kΩ = 500 Ω</text>
</svg>
