<text x="384" y="284" font-size="17" font-weight="bold" text-anchor="middle" fill="#15803d">2   2   × 10   =   220 Ω   (between 209 Ω and 231 Ω)</text>
<text x="384" y="324" font-size="13" text-anchor="middle" fill="#374151">Hold it with the gold or silver band on the right, then read from the left.</text>
