<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 768 300" width="768" height="300" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#111827"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15803d"/></marker><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b42318"/></marker><marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker></defs>
<rect width="768" height="300" rx="10" fill="#ffffff"/>
<text x="384.0" y="28" font-size="17" font-weight="bold" text-anchor="middle" fill="#111827">What a resistor looks like, and how it is drawn in a circuit</text>
<text x="200" y="64" font-size="14" font-weight="bold" text-anchor="middle" fill="#1d4ed8">The real part</text>
<rect x="65.0" y="137.5" width="270" height="5" rx="2" fill="#9ca3af" stroke="none" stroke-width="2"/>
<rect x="135.0" y="120.0" width="130" height="40" rx="20.0" fill="#e9d3a8" stroke="#a16207" stroke-width="2"/>
<rect x="155.0" y="121.0" width="12" height="38" rx="1" fill="#dc2626" stroke="none" stroke-width="1"/>
<rect x="171.9" y="121.0" width="12" height="38" rx="1" fill="#dc2626" stroke="none" stroke-width="1"/>
<rect x="188.8" y="121.0" width="12" height="38" rx="1" fill="#7c4a1e" stroke="none" stroke-width="1"/>
<rect x="233.0" y="121.0" width="12" height="38" rx="1" fill="#c9a227" stroke="#00000033" stroke-width="1"/>
<text x="200" y="196" font-size="12" text-anchor="middle" fill="#374151">colour bands = its value</text>
<text x="200" y="214" font-size="12" text-anchor="middle" fill="#374151">(this one is 220 Ω)</text>
<text x="200" y="252" font-size="13" font-weight="bold" text-anchor="middle" fill="#15803d">No + and no −: it works</text>
<text x="200" y="270" font-size="13" font-weight="bold" text-anchor="middle" fill="#15803d">both ways round</text>
<line x1="424" y1="50" x2="424" y2="284" stroke="#e5e7eb" stroke-width="2"/>
<text x="600" y="64" font-size="14" font-weight="bold" text-anchor="middle" fill="#1d4ed8">The circuit symbols</text>
<line x1="470" y1="120" x2="530" y2="120" stroke="#111827" stroke-width="2.5"/>
<polyline points="530,120 534.0,120.0 538.67,128.0 548.0,112.0 557.33,128.0 566.67,112.0 576.0,128.0 585.33,112.0 594.67,128.0 604.0,112.0 613.33,128.0 622.67,112.0 632.0,128.0 641.33,112.0 646.0,120.0 650,120" fill="none" stroke="#111827" stroke-width="2.5" stroke-linejoin="round"/>
<line x1="650" y1="120" x2="720" y2="120" stroke="#111827" stroke-width="2.5"/>
<circle cx="470" cy="120" r="4" fill="#111827"/>
<circle cx="720" cy="120" r="4" fill="#111827"/>
<text x="590" y="100" font-size="14" font-weight="bold" text-anchor="middle" fill="#111827">220</text>
<text x="600" y="152" font-size="12" text-anchor="middle" fill="#374151">American style (zigzag)</text>
<line x1="470" y1="210" x2="540" y2="210" stroke="#111827" stroke-width="2.5"/>
<rect x="540" y="196" width="100" height="28" rx="0" fill="#ffffff" stroke="#111827" stroke-width="2.5"/>
<line x1="640" y1="210" x2="720" y2="210" stroke="#111827" stroke-width="2.5"/>
<circle cx="470" cy="210" r="4" fill="#111827"/>
<circle cx="720" cy="210" r="4" fill="#111827"/>
<text x="590" y="190" font-size="14" font-weight="bold" text-anchor="middle" fill="#111827">4k7</text>
<text x="600" y="244" font-size="12" text-anchor="middle" fill="#374151">European style (box)</text>
<text x="600" y="274" font-size="12" text-anchor="middle" fill="#374151">4k7 = 4.7 kΩ: the k replaces the decimal point</text>
</svg>
