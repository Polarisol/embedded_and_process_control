<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 768 300" width="768" height="300" font-family="Helvetica, Arial, sans-serif">
<defs><linearGradient id="fade" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#1d4ed8"/><stop offset="0.55" stop-color="#1d4ed8"/><stop offset="1" stop-color="#1d4ed8" stop-opacity="0.08"/></linearGradient></defs>
<rect width="768" height="300" rx="10" fill="#ffffff"/>
<text x="384.0" y="28" font-size="17" font-weight="bold" text-anchor="middle" fill="#111827">4.3 billion addresses are not enough</text>
<text x="250" y="76" font-size="14" font-weight="bold" text-anchor="end" fill="#111827">All IPv4 addresses</text>
<rect x="262" y="56" width="69" height="30" rx="4" fill="#b42318"/>
<text x="340.8" y="76" font-size="14" font-weight="bold" text-anchor="start" fill="#b42318">4.3 billion</text>
<text x="250" y="126" font-size="14" text-anchor="end" fill="#111827">Smartphones in use</text>
<rect x="262" y="106" width="112" height="30" rx="4" fill="#6b7280"/>
<text x="384" y="126" font-size="14" font-weight="bold" text-anchor="start" fill="#6b7280">about 7 billion</text>
<text x="250" y="176" font-size="14" text-anchor="end" fill="#111827">People on Earth</text>
<rect x="262" y="156" width="131" height="30" rx="4" fill="#6b7280"/>
<text x="403.2" y="176" font-size="14" font-weight="bold" text-anchor="start" fill="#6b7280">about 8.2 billion</text>
<text x="250" y="226" font-size="14" text-anchor="end" fill="#111827">Things on the internet</text>
<rect x="262" y="206" width="490" height="30" rx="4" fill="url(#fade)"/>
<text x="274" y="226" font-size="14" font-weight="bold" text-anchor="start" fill="#ffffff">tens of billions, and growing  →</text>
<text x="384" y="262" font-size="13" text-anchor="middle" fill="#374151">Phones, laptops, TVs, cameras, cars, light bulbs, ESP32 boards... and every one wants an address.</text>
<text x="384" y="284" font-size="12" text-anchor="middle" fill="#6b7280">Even worse: about 1 in 7 IPv4 addresses is reserved for special uses and can never go to a device on the internet.</text>
</svg>
