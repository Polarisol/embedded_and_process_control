<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 768 344" width="768" height="344" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#15803d"/></marker></defs>
<rect width="768" height="344" rx="10" fill="#ffffff"/>
<text x="384.0" y="28" font-size="17" font-weight="bold" text-anchor="middle" fill="#111827">NAT: the router swaps the address on the way out, and back</text>
<text x="150" y="60" font-size="14" font-weight="bold" text-anchor="middle" fill="#1d4ed8">Inside the LAN</text>
<text x="618" y="60" font-size="14" font-weight="bold" text-anchor="middle" fill="#b42318">Out on the WAN</text>
<text x="20" y="88" font-size="13" font-weight="bold" text-anchor="start" fill="#374151">1. The ESP32 asks a server for something</text>
<rect x="20" y="96" width="260" height="60" rx="6" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.5"/>
<rect x="20" y="96" width="8" height="60" rx="3" fill="#1d4ed8"/>
<text x="42" y="121" font-size="15" font-family="Menlo, Consolas, monospace" text-anchor="start" fill="#111827">From: 192.168.1.30</text>
<text x="42" y="144" font-size="15" font-family="Menlo, Consolas, monospace" text-anchor="start" fill="#111827" xml:space="preserve">To:   142.250.75.14</text>
<rect x="488" y="96" width="260" height="60" rx="6" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.5"/>
<rect x="488" y="96" width="8" height="60" rx="3" fill="#1d4ed8"/>
<text x="510" y="121" font-size="15" font-weight="bold" font-family="Menlo, Consolas, monospace" text-anchor="start" fill="#b42318">From: 203.0.113.7</text>
<text x="510" y="144" font-size="15" font-family="Menlo, Consolas, monospace" text-anchor="start" fill="#111827" xml:space="preserve">To:   142.250.75.14</text>
<text x="20" y="200" font-size="13" font-weight="bold" text-anchor="start" fill="#374151">2. The answer comes back</text>
<rect x="488" y="208" width="260" height="60" rx="6" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.5"/>
<rect x="488" y="208" width="8" height="60" rx="3" fill="#1d4ed8"/>
<text x="510" y="233" font-size="15" font-family="Menlo, Consolas, monospace" text-anchor="start" fill="#111827">From: 142.250.75.14</text>
<text x="510" y="256" font-size="15" font-family="Menlo, Consolas, monospace" text-anchor="start" fill="#111827" xml:space="preserve">To:   203.0.113.7</text>
<rect x="20" y="208" width="260" height="60" rx="6" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.5"/>
<rect x="20" y="208" width="8" height="60" rx="3" fill="#1d4ed8"/>
<text x="42" y="233" font-size="15" font-family="Menlo, Consolas, monospace" text-anchor="start" fill="#111827">From: 142.250.75.14</text>
<text x="42" y="256" font-size="15" font-weight="bold" font-family="Menlo, Consolas, monospace" text-anchor="start" fill="#b42318" xml:space="preserve">To:   192.168.1.30</text>
<rect x="334" y="76" width="100" height="208" rx="10" fill="#115e59"/>
<text x="384" y="100" font-size="15" font-weight="bold" text-anchor="middle" fill="#ffffff">Router</text>
<rect x="342" y="146" width="84" height="76" rx="4" fill="#fef3c7"/>
<text x="384" y="162" font-size="11" font-weight="bold" text-anchor="middle" fill="#44403c">its notes:</text>
<text x="384" y="180" font-size="11" text-anchor="middle" fill="#44403c">ESP32 (…1.30)</text>
<text x="384" y="195" font-size="11" text-anchor="middle" fill="#44403c">is talking to</text>
<text x="384" y="211" font-size="10" font-family="Menlo, Consolas, monospace" text-anchor="middle" fill="#44403c">142.250.75.14</text>
<line x1="284" y1="126" x2="330" y2="126" stroke="#15803d" stroke-width="2.5" marker-end="url(#ag)"/>
<line x1="438" y1="126" x2="484" y2="126" stroke="#15803d" stroke-width="2.5" marker-end="url(#ag)"/>
<line x1="484" y1="238" x2="438" y2="238" stroke="#15803d" stroke-width="2.5" marker-end="url(#ag)"/>
<line x1="330" y1="238" x2="284" y2="238" stroke="#15803d" stroke-width="2.5" marker-end="url(#ag)"/>
<text x="384" y="312" font-size="13" text-anchor="middle" fill="#374151">The server only ever sees 203.0.113.7. A packet from outside that nobody inside asked for has no note,</text>
<text x="384" y="330" font-size="13" text-anchor="middle" fill="#374151">so the router does not know which device should get it. Outsiders cannot simply reach into your LAN.</text>
</svg>
