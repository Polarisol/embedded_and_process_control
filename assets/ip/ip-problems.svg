<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 768 366" width="768" height="366" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/></marker></defs>
<rect width="768" height="366" rx="10" fill="#ffffff"/>
<text x="384.0" y="28" font-size="17" font-weight="bold" text-anchor="middle" fill="#111827">What IP does not promise</text>
<rect x="12" y="44" width="180" height="310" rx="10" fill="#f6f7f9" stroke="#d1d5db" stroke-width="1.5"/>
<text x="102" y="72" font-size="12" text-anchor="middle" fill="#6b7280">sent</text>
<rect x="39" y="80" width="34" height="34" rx="5" fill="#e0ecfb" stroke="#1d4ed8" stroke-width="2"/>
<text x="56" y="103" font-size="16" font-weight="bold" text-anchor="middle" fill="#111827">1</text>
<rect x="85" y="80" width="34" height="34" rx="5" fill="#e0ecfb" stroke="#1d4ed8" stroke-width="2"/>
<text x="102" y="103" font-size="16" font-weight="bold" text-anchor="middle" fill="#111827">2</text>
<rect x="131" y="80" width="34" height="34" rx="5" fill="#e0ecfb" stroke="#1d4ed8" stroke-width="2"/>
<text x="148" y="103" font-size="16" font-weight="bold" text-anchor="middle" fill="#111827">3</text>
<line x1="102" y1="124" x2="102" y2="162" stroke="#9ca3af" stroke-width="2" marker-end="url(#agr)"/>
<text x="102" y="180" font-size="12" text-anchor="middle" fill="#6b7280">arrived</text>
<rect x="39" y="188" width="34" height="34" rx="5" fill="#e0ecfb" stroke="#1d4ed8" stroke-width="2"/>
<text x="56" y="211" font-size="16" font-weight="bold" text-anchor="middle" fill="#111827">1</text>
<rect x="85" y="188" width="34" height="34" rx="5" fill="none" stroke="#b42318" stroke-width="2" stroke-dasharray="4 3"/>
<text x="102" y="211" font-size="16" font-weight="bold" text-anchor="middle" fill="#b42318">?</text>
<rect x="131" y="188" width="34" height="34" rx="5" fill="#e0ecfb" stroke="#1d4ed8" stroke-width="2"/>
<text x="148" y="211" font-size="16" font-weight="bold" text-anchor="middle" fill="#111827">3</text>
<text x="114" y="148" font-size="11" text-anchor="start" fill="#b42318">packet 2 lost</text>
<text x="102" y="286" font-size="15" font-weight="bold" text-anchor="middle" fill="#111827">Lost</text>
<text x="102" y="306" font-size="12" text-anchor="middle" fill="#374151">A busy router can simply</text>
<text x="102" y="322" font-size="12" text-anchor="middle" fill="#374151">throw a packet away.</text>
<text x="102" y="338" font-size="12" text-anchor="middle" fill="#374151">Nobody tells the sender.</text>
<rect x="200" y="44" width="180" height="310" rx="10" fill="#f6f7f9" stroke="#d1d5db" stroke-width="1.5"/>
<text x="290" y="72" font-size="12" text-anchor="middle" fill="#6b7280">sent</text>
<rect x="227" y="80" width="34" height="34" rx="5" fill="#e0ecfb" stroke="#1d4ed8" stroke-width="2"/>
<text x="244" y="103" font-size="16" font-weight="bold" text-anchor="middle" fill="#111827">1</text>
<rect x="273" y="80" width="34" height="34" rx="5" fill="#e0ecfb" stroke="#1d4ed8" stroke-width="2"/>
<text x="290" y="103" font-size="16" font-weight="bold" text-anchor="middle" fill="#111827">2</text>
<rect x="319" y="80" width="34" height="34" rx="5" fill="#e0ecfb" stroke="#1d4ed8" stroke-width="2"/>
<text x="336" y="103" font-size="16" font-weight="bold" text-anchor="middle" fill="#111827">3</text>
<line x1="290" y1="124" x2="290" y2="162" stroke="#9ca3af" stroke-width="2" marker-end="url(#agr)"/>
<text x="290" y="180" font-size="12" text-anchor="middle" fill="#6b7280">arrived</text>
<rect x="227" y="188" width="34" height="34" rx="5" fill="#e0ecfb" stroke="#1d4ed8" stroke-width="2"/>
<text x="244" y="211" font-size="16" font-weight="bold" text-anchor="middle" fill="#111827">1</text>
<rect x="273" y="188" width="34" height="34" rx="5" fill="#fef3c7" stroke="#a16207" stroke-width="2"/>
<text x="290" y="211" font-size="16" font-weight="bold" text-anchor="middle" fill="#111827">3</text>
<rect x="319" y="188" width="34" height="34" rx="5" fill="#fef3c7" stroke="#a16207" stroke-width="2"/>
<text x="336" y="211" font-size="16" font-weight="bold" text-anchor="middle" fill="#111827">2</text>
<text x="290" y="286" font-size="15" font-weight="bold" text-anchor="middle" fill="#111827">Out of order</text>
<text x="290" y="306" font-size="12" text-anchor="middle" fill="#374151">Packets can take different</text>
<text x="290" y="322" font-size="12" text-anchor="middle" fill="#374151">roads, so they can arrive</text>
<text x="290" y="338" font-size="12" text-anchor="middle" fill="#374151">in a different order.</text>
<rect x="388" y="44" width="180" height="310" rx="10" fill="#f6f7f9" stroke="#d1d5db" stroke-width="1.5"/>
<text x="478" y="72" font-size="12" text-anchor="middle" fill="#6b7280">sent</text>
<rect x="415" y="80" width="34" height="34" rx="5" fill="#e0ecfb" stroke="#1d4ed8" stroke-width="2"/>
<text x="432" y="103" font-size="16" font-weight="bold" text-anchor="middle" fill="#111827">1</text>
<rect x="461" y="80" width="34" height="34" rx="5" fill="#e0ecfb" stroke="#1d4ed8" stroke-width="2"/>
<text x="478" y="103" font-size="16" font-weight="bold" text-anchor="middle" fill="#111827">2</text>
<rect x="507" y="80" width="34" height="34" rx="5" fill="#e0ecfb" stroke="#1d4ed8" stroke-width="2"/>
<text x="524" y="103" font-size="16" font-weight="bold" text-anchor="middle" fill="#111827">3</text>
<line x1="478" y1="124" x2="478" y2="162" stroke="#9ca3af" stroke-width="2" marker-end="url(#agr)"/>
<text x="478" y="180" font-size="12" text-anchor="middle" fill="#6b7280">arrived</text>
<rect x="401" y="188" width="34" height="34" rx="5" fill="#e0ecfb" stroke="#1d4ed8" stroke-width="2"/>
<text x="418" y="211" font-size="16" font-weight="bold" text-anchor="middle" fill="#111827">1</text>
<rect x="441" y="188" width="34" height="34" rx="5" fill="#e0ecfb" stroke="#1d4ed8" stroke-width="2"/>
<text x="458" y="211" font-size="16" font-weight="bold" text-anchor="middle" fill="#111827">2</text>
<rect x="481" y="188" width="34" height="34" rx="5" fill="#fef3c7" stroke="#a16207" stroke-width="2"/>
<text x="498" y="211" font-size="16" font-weight="bold" text-anchor="middle" fill="#111827">2</text>
<rect x="521" y="188" width="34" height="34" rx="5" fill="#e0ecfb" stroke="#1d4ed8" stroke-width="2"/>
<text x="538" y="211" font-size="16" font-weight="bold" text-anchor="middle" fill="#111827">3</text>
<text x="478" y="286" font-size="15" font-weight="bold" text-anchor="middle" fill="#111827">Duplicated</text>
<text x="478" y="306" font-size="12" text-anchor="middle" fill="#374151">Sometimes the very</text>
<text x="478" y="322" font-size="12" text-anchor="middle" fill="#374151">same packet arrives</text>
<text x="478" y="338" font-size="12" text-anchor="middle" fill="#374151">twice.</text>
<rect x="576" y="44" width="180" height="310" rx="10" fill="#f6f7f9" stroke="#d1d5db" stroke-width="1.5"/>
<text x="666" y="72" font-size="12" text-anchor="middle" fill="#6b7280">sent</text>
<rect x="603" y="80" width="34" height="34" rx="5" fill="#e0ecfb" stroke="#1d4ed8" stroke-width="2"/>
<text x="620" y="103" font-size="16" font-weight="bold" text-anchor="middle" fill="#111827">1</text>
<rect x="649" y="80" width="34" height="34" rx="5" fill="#e0ecfb" stroke="#1d4ed8" stroke-width="2"/>
<text x="666" y="103" font-size="16" font-weight="bold" text-anchor="middle" fill="#111827">2</text>
<rect x="695" y="80" width="34" height="34" rx="5" fill="#e0ecfb" stroke="#1d4ed8" stroke-width="2"/>
<text x="712" y="103" font-size="16" font-weight="bold" text-anchor="middle" fill="#111827">3</text>
<line x1="666" y1="124" x2="666" y2="162" stroke="#9ca3af" stroke-width="2" marker-end="url(#agr)"/>
<text x="666" y="180" font-size="12" text-anchor="middle" fill="#6b7280">arrived</text>
<rect x="603" y="188" width="34" height="34" rx="5" fill="#e0ecfb" stroke="#1d4ed8" stroke-width="2"/>
<text x="620" y="211" font-size="16" font-weight="bold" text-anchor="middle" fill="#111827">1</text>
<rect x="649" y="188" width="34" height="34" rx="5" fill="#fde2e1" stroke="#b42318" stroke-width="2"/>
<text x="666" y="211" font-size="16" font-weight="bold" text-anchor="middle" fill="#111827">2</text>
<rect x="695" y="188" width="34" height="34" rx="5" fill="#e0ecfb" stroke="#1d4ed8" stroke-width="2"/>
<text x="712" y="211" font-size="16" font-weight="bold" text-anchor="middle" fill="#111827">3</text>
<text x="666" y="244" font-size="11" font-family="Menlo, Consolas, monospace" text-anchor="middle" fill="#374151" xml:space="preserve">sent  'A' 01000001</text>
<text x="666" y="260" font-size="11" text-anchor="middle" font-family="Menlo, Consolas, monospace" fill="#374151" xml:space="preserve">got   'E' 01000<tspan fill="#b42318" font-weight="bold">1</tspan>01</text>
<text x="666" y="286" font-size="15" font-weight="bold" text-anchor="middle" fill="#111827">Damaged</text>
<text x="666" y="306" font-size="12" text-anchor="middle" fill="#374151">A bit can flip on the way.</text>
<text x="666" y="322" font-size="12" text-anchor="middle" fill="#374151">IP does not check your</text>
<text x="666" y="338" font-size="12" text-anchor="middle" fill="#374151">data for mistakes.</text>
</svg>
