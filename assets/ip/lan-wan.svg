<text x="758" y="270" font-size="13" font-weight="bold" text-anchor="end" fill="#111827">Server</text>
<text x="758" y="287" font-size="12" font-family="Menlo, Consolas, monospace" text-anchor="end" fill="#374151">142.250.75.14</text>
<text x="440" y="328" font-size="13" text-anchor="start" fill="#374151">Your neighbour's LAN uses 192.168.1.x too.</text>
<text x="440" y="348" font-size="13" text-anchor="start" fill="#374151">No clash: private addresses never leave the LAN.</text>
<text x="440" y="368" font-size="13" text-anchor="start" fill="#374151">The outside world only sees the router's WAN address.</text>
